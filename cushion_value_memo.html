<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>クッション値メモ</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 18px; background: #f6f4f0;
    font-family: -apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
    color:#222;
  }
  .card {
    max-width: 560px; margin: 0 auto; background:#fff;
    border:1px solid #ddd8d0; border-radius:16px; padding:24px;
    box-shadow:0 5px 18px rgba(0,0,0,.05);
  }
  h1 { font-size:20px; margin:0 0 22px; }
  .value { text-align:center; font-size:42px; font-weight:700; margin:4px 0 20px; }
  .value small { font-size:16px; font-weight:500; margin-left:4px; }
  input[type=range] { width:100%; accent-color:#333; cursor:pointer; }
  .scale { display:flex; justify-content:space-between; font-size:12px; color:#777; margin-top:7px; }
  .ticks { display:flex; justify-content:space-between; margin-top:8px; color:#aaa; font-size:10px; }
  .memo { margin-top:26px; }
  label { display:block; font-size:13px; color:#666; margin-bottom:7px; }
  input[type=text] {
    width:100%; padding:11px 12px; border:1px solid #d7d2ca; border-radius:9px;
    font-size:15px; outline:none;
  }
  button {
    width:100%; margin-top:14px; padding:12px; border:0; border-radius:9px;
    background:#222; color:#fff; font-size:15px; cursor:pointer;
  }
  .saved { margin-top:22px; border-top:1px solid #eee; padding-top:16px; }
  .row { display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid #eee; font-size:14px; }
  .date { color:#888; font-size:12px; }
</style>
</head>
<body>
<div class="card">
  <h1>クッション値メモ</h1>

  <div class="value"><span id="value">8.0</span><small></small></div>

  <input id="slider" type="range" min="0" max="12" step="0.1" value="8.0"
         aria-label="クッション値">
  <div class="scale"><span>0</span><span>3</span><span>6</span><span>9</span><span>12</span></div>

  <div class="memo">
    <label for="memo">メモ（任意）</label>
    <input id="memo" type="text" placeholder="例：雨上がり・内有利">
    <button id="save">記録する</button>
  </div>

  <div class="saved" id="saved"></div>
</div>

<script>
const slider = document.getElementById('slider');
const value = document.getElementById('value');
const memo = document.getElementById('memo');
const saved = document.getElementById('saved');

slider.addEventListener('input', () => {
  value.textContent = Number(slider.value).toFixed(1);
});

function render() {
  const data = JSON.parse(localStorage.getItem('cushionMemo') || '[]');
  saved.innerHTML = data.length ? '<label>記録</label>' + data.map(x =>
    `<div class="row"><span><b>${x.value}</b> ${escapeHtml(x.memo)}</span><span class="date">${x.date}</span></div>`
  ).join('') : '';
}
function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
document.getElementById('save').addEventListener('click', () => {
  const data = JSON.parse(localStorage.getItem('cushionMemo') || '[]');
  data.unshift({
    value: Number(slider.value).toFixed(1),
    memo: memo.value,
    date: new Date().toLocaleDateString('ja-JP')
  });
  localStorage.setItem('cushionMemo', JSON.stringify(data));
  memo.value = '';
  render();
});
render();
</script>
</body>
</html>
