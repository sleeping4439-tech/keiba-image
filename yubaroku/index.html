>能力名をタップして5段階評価を変更</div><div class="detail-section"><div class="detail-head"><strong>特性</strong><small>CHARACTERISTICS</small><button class="textbtn" id="addTrait">＋ 追加</button></div><div class="traits" id="traits"></div></div><div class="detail-section"><div class="detail-head"><strong>メモ</strong><small>MEMO</small></div><textarea id="memo" class="memo" maxlength="500" placeholder="気になる特徴やレースでの印象を記録…"></textarea><div class="sub" id="counter" style="text-align:right"></div></div><div class="profile-save"><button type="button" id="profileSave" class="save-cloud">変更をクラウドに保存</button><span class="cloud-status" id="profileStatus">未接続・ローカル下書き</span></div><button class="danger" id="delete">この馬を削除する</button></section></main><div id="modal"></div><script>
const KEY='yubarokuHorsesV1';const attrs=[{name:'基礎スピード',desc:'無理なく巡航できる速度の高さ',pos:[50,5]},{name:'最高速度',desc:'瞬間的に到達できる速度の上限',pos:[85,32]},{name:'速度持続',desc:'高い速度をどれだけ長く維持できるか',pos:[72,87]},{name:'運動持続',desc:'消耗しても運動を続けられる能力。スタミナ・耐久力',pos:[28,87]},{name:'パワー',desc:'坂や重い馬場など、抵抗に対抗する能力',pos:[15,32]}];const $=id=>document.getElementById(id);let horses=[];try{horses=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(horses))horses=[]}catch{};let active=null;function save(){try{localStorage.setItem(KEY,JSON.stringify(horses))}catch{alert('保存できませんでした。ブラウザの保存設定を確認してください。')}}function makeHorse(name){return{id:Date.now().toString(36)+Math.random().toString(36).slice(2,8),name,values:[3,3,3,3,3],traits:[],memo:''}}function current(){return horses.find(h=>h.id===active)}function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function showHome(){active=null;$('profile').classList.add('hidden');$('home').classList.remove('hidden');renderList();window.scrollTo(0,0)}function openHorse(id){active=id;$('home').classList.add('hidden');$('profile').classList.remove('hidden');$('horseName').value=current().name;$('memo').value=current().memo;renderProfile();window.scrollTo(0,0)}function renderList(){const q=$('search').value.trim().toLocaleLowerCase();const filtered=horses.filter(h=>h.name.toLocaleLowerCase().includes(q));$('count').textContent=horses.length+' 頭';$('list').innerHTML='';if(!filtered.length){$('list').innerHTML='<div class="empty">'+(horses.length?'該当する馬が見つかりません':'まだ馬が登録されていません。<br>「＋ 馬を登録」から始めましょう。')+'</div>';return}for(const h of filtered){const b=document.createElement('button');b.className='horse';const tags=h.traits.slice(0,3).map(t=>'<span class="chip '+(t.negative?'neg':'')+'">'+escapeHTML(t.text)+'</span>').join('');b.innerHTML='<div class="monogram">馬</div><div class="horse-info"><div class="horse-name">'+escapeHTML(h.name)+'</div><div class="horse-detail">基礎スピード '+h.values[0]+'　/　最高速度 '+h.values[1]+'</div><div class="chips">'+tags+'</div></div><span class="arrow">›</span>';b.onclick=()=>openHorse(h.id);$('list').append(b)}}function point(n,i){const a=-Math.PI/2+i*2*Math.PI/5;return[200+Math.cos(a)*n*25,174+Math.sin(a)*n*25]}function points(a){return a.map((v,i)=>point(v,i).join(',')).join(' ')}function renderProfile(){const h=current();if(!h)return;let g='';for(let n=1;n<=5;n++)g+='<polygon points="'+points([n,n,n,n,n])+'" fill="none" stroke="#a8c5b8" stroke-opacity="'+(n===5?.7:.34)+'"/>';for(let i=0;i<5;i++){const p=point(5,i);g+='<line x1="200" y1="174" x2="'+p[0]+'" y2="'+p[1]+'" stroke="#a8c5b8" stroke-opacity=".4"/>'}$('grid').innerHTML=g;$('shape').setAttribute('points',points(h.values));$('dots').innerHTML=h.values.map((v,i)=>{const p=point(v,i);return'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="4" fill="#147c5d"/>'}).join('');document.querySelectorAll('.attribute').forEach((b,i)=>b.innerHTML=attrs[i].name+'<b>'+h.values[i]+'</b>');$('traits').innerHTML='';h.traits.forEach((t,i)=>{const b=document.createElement('button');b.className='trait'+(t.negative?' neg':'');b.innerHTML=escapeHTML(t.text)+'<span>×</span>';b.title='クリックして削除';b.onclick=()=>{if(confirm('「'+t.text+'」を削除しますか？')){h.traits.splice(i,1);save();renderProfile()}};$('traits').append(b)});$('counter').textContent=h.memo.length+' / 500'}attrs.forEach((a,i)=>{const b=document.createElement('button');b.className='attribute';b.style.left=a.pos[0]+'%';b.style.top=a.pos[1]+'%';b.onclick=()=>editAttr(i);$('radar').append(b)});function close(){$('modal').innerHTML=''}function dialog(html){$('modal').innerHTML='<div class="overlay"><div class="dialog" role="dialog" aria-modal="true">'+html+'</div></div>';$('modal').querySelector('.overlay').onclick=e=>{if(e.target.classList.contains('overlay'))close()}}function editAttr(i){const h=current();dialog('<h3>'+attrs[i].name+'</h3><p>'+attrs[i].desc+'</p><div class="choices">'+[1,2,3,4,5].map(n=>'<button data-n="'+n+'" class="'+(h.values[i]===n?'on':'')+'">'+n+'</button>').join('')+'</div><div class="actions"><button id="cancel">閉じる</button></div>');$('cancel').onclick=close;document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{h.values[i]=Number(b.dataset.n);save();renderProfile();close()})}$('add').onclick=()=>{dialog('<h3>新しい馬を登録</h3><p>馬名を入力してプロフィールを作成します。</p><input id="newName" maxlength="45" placeholder="馬名を入力"><div class="actions"><button id="cancel">キャンセル</button><button class="yes" id="create">登録する</button></div>');$('cancel').onclick=close;function create(){const name=$('newName').value.trim();if(!name){$('newName').focus();return}const h=makeHorse(name);horses.unshift(h);save();close();openHorse(h.id)}$('create').onclick=create;$('newName').onkeydown=e=>{if(e.key==='Enter')create()};$('newName').focus()};$('search').oninput=renderList;$('back').onclick=showHome;$('horseName').oninput=e=>{const h=current();h.name=e.target.value;save()};$('memo').oninput=e=>{const h=current();h.memo=e.target.value;save();$('counter').textContent=h.memo.length+' / 500'};$('addTrait').onclick=()=>{dialog('<h3>特性を追加</h3><p>特性名と種類を入力してください。</p><input id="traitName" maxlength="30" placeholder="例：二の脚"><select id="traitType"><option value="pos">プラス特性</option><option value="neg">マイナス特性</option></select><div class="actions"><button id="cancel">キャンセル</button><button class="yes" id="submit">追加する</button></div>');$('cancel').onclick=close;$('submit').onclick=()=>{const t=$('traitName').value.trim();if(!t)return;current().traits.push({text:t,negative:$('traitType').value==='neg'});save();renderProfile();close()};$('traitName').focus()};$('delete').onclick=()=>{const h=current();if(confirm('「'+h.name+'」を削除しますか？ この操作は取り消せません。')){horses=horses.filter(x=>x.id!==active);save();showHome()}};renderList();

// Persistent backup and direct profile links; no remote data is transmitted.
const originalOpenHorse=openHorse;
openHorse=function(id){if(!horses.some(h=>h.id===id))return showHome();originalOpenHorse(id);if(location.hash!=='#horse/'+encodeURIComponent(id))history.replaceState(null,'','#horse/'+encodeURIComponent(id));};
const originalShowHome=showHome;
showHome=function(){originalShowHome();if(location.hash)history.replaceState(null,'',location.pathname+location.search);};
function navigateFromHash(){const m=location.hash.match(/^#horse\/(.+)$/);if(m){const id=decodeURIComponent(m[1]);if(horses.some(h=>h.id===id)){if(active!==id)openHorse(id);return}}if(active!==null)showHome()}
window.addEventListener('hashchange',navigateFromHash);
function exportBackup(){const data={format:'yubaroku',version:1,exportedAt:new Date().toISOString(),horses};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='yubaroku-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}
$('exportData').addEventListener('click',exportBackup);
$('importData').addEventListener('click',()=>$('importFile').click());
$('importFile').addEventListener('change',async e=>{const f=e.target.files?.[0];e.target.value='';if(!f)return;if(f.size>5*1024*1024){alert('ファイルが大きすぎます（上限5MB）。');return}try{const parsed=JSON.parse(await f.text());if(parsed.format!=='yubaroku'||parsed.version!==1||!Array.isArray(parsed.horses))throw Error('ゆ馬録のバックアップ形式ではありません');if(parsed.horses.length>10000)throw Error('登録件数が多すぎます');const imported=parsed.horses.map(h=>{if(typeof h.id!=='string'||typeof h.name!=='string'||!Array.isArray(h.values)||h.values.length!==5||h.values.some(v=>!Number.isInteger(v)||v<1||v>5)||!Array.isArray(h.traits)||typeof h.memo!=='string')throw Error('馬のデータが不正です');return{id:h.id.slice(0,100),name:h.name.slice(0,45),values:h.values,traits:h.traits.slice(0,100).map(t=>({text:String(t.text||'').slice(0,30),negative:!!t.negative})),memo:h.memo.slice(0,500)}});if(new Set(imported.map(h=>h.id)).size!==imported.length)throw Error('重複した馬IDがあります');if(!confirm('現在の'+horses.length+'頭の記録を、バックアップの'+imported.length+'頭で置き換えます。続けますか？'))return;horses=imported;save();showHome();alert('バックアップを読み込みました。')}catch(err){alert('読み込みできませんでした：'+err.message)}});
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('modal').children.length)close()});
// Prevent blank horse names when leaving the edit field.
$('horseName').addEventListener('blur',()=>{const h=current();if(!h)return;if(!h.name.trim()){h.name='名称未設定';$('horseName').value=h.name;save()}else if(h.name!==h.name.trim()){h.name=h.name.trim();$('horseName').value=h.name;save()}});
navigateFromHash();

// Cloud data is changed ONLY when the user presses a cloud-save button.
// Browser localStorage remains a draft/recovery cache, not a synchronization mechanism.
const CLOUD_CFG_KEY='yubarokuSupabaseConfigV1';
const CLOUD_AUTH_KEY='yubarokuSupabaseSessionV1';
let cloudCfg=null, cloudSession=null, cloudRevision=null, cloudReady=false, cloudBusy=false;
let savedSnapshot=JSON.stringify(horses);
try{cloudCfg=JSON.parse(localStorage.getItem(CLOUD_CFG_KEY)||'null');cloudSession=JSON.parse(sessionStorage.getItem(CLOUD_AUTH_KEY)||'null')}catch{}
const stateText=(message,error=false)=>{for(const id of ['cloudStatus','profileStatus']){const el=$(id);if(el){el.textContent=message;el.classList.toggle('error',error)}}};
function markDraft(){stateText(cloudReady?'未保存の変更があります':'ローカル下書き（クラウド未接続）')}
// Existing edit handlers call save(). Keep their local recovery behavior but never send changes to cloud.
const originalDraftSave=save;
save=function(){originalDraftSave();markDraft()};
function validateCloudConfig(c){try{const u=new URL(c.url);return u.protocol==='https:'&&/^[a-z0-9-]+\.supabase\.co$/i.test(u.hostname)&&typeof c.key==='string'&&c.key.length>15}catch{return false}}
function cloudHeaders(auth=true){const h={'apikey':cloudCfg.key,'Content-Type':'application/json'};if(auth&&cloudSession?.access_token)h.Authorization='Bearer '+cloudSession.access_token;return h}
async function cloudRequest(path,opts={}){if(!validateCloudConfig(cloudCfg))throw Error('SupabaseのURLと公開キーを設定してください');const res=await fetch(cloudCfg.url.replace(/\/$/,'')+path,{...opts,headers:{...cloudHeaders(),...(opts.headers||{})}});let body=null;try{body=await res.json()}catch{}if(!res.ok)throw Error(body?.msg||body?.message||body?.error_description||body?.error||('通信エラー '+res.status));return{body,status:res.status}}
async function ensureSession(){if(!cloudSession)throw Error('ログインが必要です');if(Date.now()<cloudSession.expires_at-60000)return;const res=await cloudRequest('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:cloudSession.refresh_token})});cloudSession={...res.body,expires_at:Date.now()+res.body.expires_in*1000};sessionStorage.setItem(CLOUD_AUTH_KEY,JSON.stringify(cloudSession))}
function validHorses(input){if(!Array.isArray(input)||input.length>20000)throw Error('馬データの形式が不正です');const ids=new Set();return input.map(h=>{if(typeof h.id!=='string'||!h.id||ids.has(h.id)||typeof h.name!=='string'||!Array.isArray(h.values)||h.values.length!==5||h.values.some(v=>!Number.isInteger(v)||v<1||v>5)||!Array.isArray(h.traits)||typeof h.memo!=='string')throw Error('馬データの内容が不正です');ids.add(h.id);return{id:h.id.slice(0,100),name:h.name.slice(0,45),values:h.values.slice(),traits:h.traits.slice(0,100).map(t=>({text:String(t.text||'').slice(0,30),negative:!!t.negative})),memo:h.memo.slice(0,500)}})}
function syncView(){if(active&&!horses.some(h=>h.id===active))showHome();else if(active){$('horseName').value=current().name;$('memo').value=current().memo;renderProfile()}else renderList()}
async function fetchCloud(){await ensureSession();const {body}=await cloudRequest('/rest/v1/yubaroku_store?select=revision,data&owner_id=eq.'+encodeURIComponent(cloudSession.user.id)+'&limit=1',{method:'GET'});return Array.isArray(body)&&body.length?body[0]:null}
async function cloudLoad(){if(cloudBusy)return;cloudBusy=true;stateText('クラウドから読込中…');try{const row=await fetchCloud();const remote=validHorses(row?.data?.horses||[]);if(JSON.stringify(horses)!==JSON.stringify(remote)&&horses.length&&!confirm('クラウドの'+remote.length+'頭を読み込み、現在のローカル下書き（'+horses.length+'頭）を置き換えます。未保存の変更は失われます。続けますか？')){stateText('読み込みをキャンセルしました');return}horses=remote;cloudRevision=row?.revision??null;cloudReady=true;originalDraftSave();savedSnapshot=JSON.stringify(horses);syncView();stateText('クラウド読込済み・保存済み（'+horses.length+'頭）')}catch(e){stateText('読込失敗：'+e.message,true)}finally{cloudBusy=false}}
async function cloudSave(){if(cloudBusy)return;cloudBusy=true;stateText('クラウドに保存中…');try{await ensureSession();const safe=validHorses(horses);const owner=cloudSession.user.id;const data={version:1,horses:safe};if(cloudRevision===null){const response=await cloudRequest('/rest/v1/yubaroku_store',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({owner_id:owner,revision:1,data})});cloudRevision=response.body?.[0]?.revision??1}else{const response=await cloudRequest('/rest/v1/yubaroku_store?owner_id=eq.'+encodeURIComponent(owner)+'&revision=eq.'+cloudRevision,{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify({revision:cloudRevision+1,data})});if(!Array.isArray(response.body)||response.body.length!==1)throw Error('別端末でデータが更新されています。先にJSONバックアップを書き出し、クラウドを読み込んで変更を確認してください。');cloudRevision=response.body[0].revision}cloudReady=true;originalDraftSave();savedSnapshot=JSON.stringify(horses);stateText('保存完了（'+horses.length+'頭・版'+cloudRevision+'）')}catch(e){stateText('保存失敗：'+e.message,true);alert('クラウド保存に失敗しました。\n'+e.message+'\n\nローカル下書きは残っています。')}finally{cloudBusy=false}}
$('cloudSave').onclick=cloudSave;$('profileSave').onclick=cloudSave;$('cloudLoad').onclick=cloudLoad;
$('cloudSetup').onclick=()=>{dialog('<h3>クラウド接続</h3><p>SupabaseのProject URLとPublishable key（またはanon key）を入力。service_role / secret keyは入力しないでください。</p><input class="config-input" id="supUrl" placeholder="https://xxxx.supabase.co"><input class="config-input" id="supKey" placeholder="sb_publishable_... / anon key"><input class="config-input" id="supEmail" type="email" placeholder="メールアドレス"><input class="config-input" id="supPass" type="password" placeholder="パスワード"><p class="setup-note">接続情報はこの端末に保存。ログイン状態はブラウザのタブ単位で保持します。認証ユーザーはSupabase管理画面で作成してください。</p><div class="actions"><button id="cloudLogout">ログアウト</button><button id="cancel">閉じる</button><button class="yes" id="cloudLogin">設定してログイン</button></div>');$('supUrl').value=cloudCfg?.url||'';$('supKey').value=cloudCfg?.key||'';$('cancel').onclick=close;$('cloudLogout').onclick=()=>{cloudSession=null;cloudReady=false;cloudRevision=null;sessionStorage.removeItem(CLOUD_AUTH_KEY);stateText('ログアウトしました');close()};$('cloudLogin').onclick=async()=>{const cfg={url:$('supUrl').value.trim().replace(/\/$/,''),key:$('supKey').value.trim()};if(!validateCloudConfig(cfg)){alert('URLまたは公開キーが不正です');return}const email=$('supEmail').value.trim(),password=$('supPass').value;if(!email||!password){alert('メールアドレスとパスワードを入力してください');return}const btn=$('cloudLogin');btn.disabled=true;btn.textContent='ログイン中…';try{cloudCfg=cfg;const {body}=await cloudRequest('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password})});if(!body?.access_token||!body?.user?.id)throw Error('認証に失敗しました');cloudSession={...body,expires_at:Date.now()+body.expires_in*1000};localStorage.setItem(CLOUD_CFG_KEY,JSON.stringify(cfg));sessionStorage.setItem(CLOUD_AUTH_KEY,JSON.stringify(cloudSession));cloudRevision=null;cloudReady=false;close();stateText('ログイン成功・クラウドから読み込んでください');await cloudLoad()}catch(e){alert('ログイン失敗：'+e.message);btn.disabled=false;btn.textContent='設定してログイン'}}};
function downloadText(filename,text,type){const blob=new Blob(['\ufeff'+text],{type});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
$('exportCsv').onclick=()=>{const head=['馬ID','馬名','基礎スピード','最高速度','速度持続','運動持続','パワー','特性JSON','メモ'];const quote=x=>'"'+String(x??'').replace(/"/g,'""')+'"';const rows=[head,...horses.map(h=>[h.id,h.name,...h.values,JSON.stringify(h.traits),h.memo])];downloadText('yubaroku-'+new Date().toISOString().slice(0,10)+'.csv',rows.map(row=>row.map(quote).join(',')).join('\r\n'),'text/csv;charset=utf-8')};
window.addEventListener('beforeunload',e=>{if(cloudReady&&JSON.stringify(horses)!==savedSnapshot){e.preventDefault();e.returnValue=''}});
if(cloudSession){stateText('ログイン情報あり・クラウドから読込してください');}else stateText('未接続・ローカル下書き');
</script></body></html>
