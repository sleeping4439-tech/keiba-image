<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>競馬 馬場情報メモ</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:20px 14px;background:#f5f3ef;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Kaku Gothic ProN",sans-serif}.card{max-width:760px;margin:auto;background:#fff;border:1px solid #ddd8d0;border-radius:16px;padding:20px;box-shadow:0 5px 18px rgba(0,0,0,.05)}h1{font-size:21px;margin:0 0 16px}.top{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center}.top select,.top button,.settings input{font:inherit;padding:10px 11px;border:1px solid #d7d2ca;border-radius:9px;background:#fff}.top button,.settings button{background:#222;color:#fff;border:0;cursor:pointer}.status{font-size:12px;color:#777;margin:10px 0 16px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.box{border:1px solid #e5e1db;border-radius:11px;padding:12px;background:#fcfbf9}.label{font-size:11px;color:#777;margin-bottom:5px}.val{font-size:19px;font-weight:700}.cushion{margin:15px 0;border:1px solid #ddd8d0;border-radius:13px;padding:15px}.cushion-head{display:flex;justify-content:space-between;align-items:end}.cushion-value{font-size:43px;font-weight:800}.cushion-value small{font-size:13px;font-weight:500}.muted{font-size:11px;color:#888}input[type=range]{width:100%;accent-color:#222;margin-top:9px}.scale{display:flex;justify-content:space-between;font-size:10px;color:#888}.section{margin-top:20px;border-top:1px solid #eee;padding-top:16px}.section h2{font-size:15px;margin:0 0 10px}.history{max-height:430px;overflow:auto}.hist{padding:11px 0;border-bottom:1px solid #eee}.hist-head{display:flex;justify-content:space-between;gap:10px;font-weight:700}.hist-meta{font-size:11px;color:#777;margin-top:4px;line-height:1.6}.memo{margin-top:15px}.memo input{width:100%;padding:10px;border:1px solid #d7d2ca;border-radius:9px;font:inherit}.save{width:100%;margin-top:9px;padding:11px;border:0;border-radius:9px;background:#222;color:#fff;cursor:pointer}.notice{font-size:11px;color:#777;line-height:1.6;margin-top:14px}.settings{display:none;margin-top:12px;padding:12px;border:1px solid #e5e1db;border-radius:10px;background:#faf9f7}.settings.show{display:block}.settings-row{display:flex;gap:7px;margin-top:7px}.settings input{flex:1}.small{font-size:11px;color:#888}@media(max-width:560px){.top{grid-template-columns:1fr 1fr}.top select{grid-column:1/-1}.grid{grid-template-columns:1fr}.cushion-value{font-size:38px}.hist-head{display:block}.settings-row{display:block}.settings button{margin-top:7px;width:100%}}
</style>
</head>
<body>
<div class="card">
<h1>競馬 馬場情報メモ</h1>
<div class="top">
<select id="course">
<option value="tokyo" selected>東京競馬場</option><option value="kyoto">京都競馬場</option>
</select>
<button id="refresh">今すぐ更新</button><button id="settingsBtn">設定</button>
</div>
<div id="status" class="status">起動中…</div>
<div class="grid">
<div class="box"><div class="label">開催</div><div class="val" id="meeting">—</div></div><div class="box"><div class="label">天候</div><div class="val" id="weather">—</div></div><div class="box"><div class="label">芝</div><div class="val" id="turf">—</div></div><div class="box"><div class="label">ダート</div><div class="val" id="dirt">—</div></div>
</div>
<div class="cushion"><div class="cushion-head"><div><div class="label">芝のクッション値</div><div class="cushion-value"><span id="cushion">—</span><small> </small></div></div><div id="cushionTime" class="muted">測定時刻：—</div></div><input id="slider" type="range" min="0" max="12" step="0.1" value="8.0"><div class="scale"><span>0</span><span>3</span><span>6</span><span>9</span><span>12</span></div></div>
<div class="grid"><div class="box"><div class="label">芝 含水率・ゴール前</div><div class="val" id="turfGoal">—</div></div><div class="box"><div class="label">芝 含水率・4コーナー</div><div class="val" id="turf4">—</div></div><div class="box"><div class="label">ダート 含水率・ゴール前</div><div class="val" id="dirtGoal">—</div></div><div class="box"><div class="label">ダート 含水率・4コーナー</div><div class="val" id="dirt4">—</div></div></div>
<div class="memo"><input id="memo" type="text" placeholder="メモ：開幕週・内有利／雨上がり"><button class="save" id="save">現在の馬場情報を記録</button></div>
<div class="section"><h2>自動保存された馬場履歴</h2><div id="history" class="history"><div class="muted">履歴を読み込み中…</div></div></div>
<div class="settings" id="settings"><div class="small">Cloudflare Worker URL（初回のみ設定）</div><div class="settings-row"><input id="workerUrl" placeholder="https://xxxxx.workers.dev"><button id="saveSettings">保存</button></div></div>
<div class="notice">ページを開くと自動取得。以後15分ごとに確認します。サーバー側では同じ値を重複保存せず、変化があった馬場情報だけ履歴に残します。</div>
</div>
<script>
const COURSE_NAMES={tokyo:'東京競馬場',kyoto:'京都競馬場'};
const $=id=>document.getElementById(id);let timer=null;
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function worker(){return (localStorage.getItem('jraWorkerUrl')||'').replace(/\/+$/,'');}
function setData(d){$('meeting').textContent=d.meeting||'—';$('weather').textContent=d.weather||'—';$('turf').textContent=d.turf||'—';$('dirt').textContent=d.dirt||'—';if(d.cushion!=null){$('slider').value=d.cushion;$('cushion').textContent=Number(d.cushion).toFixed(1)}else $('cushion').textContent='—';$('cushionTime').textContent='測定時刻：'+(d.cushionTime||'—');$('turfGoal').textContent=d.turfGoal!=null?d.turfGoal+' %':'—';$('turf4').textContent=d.turf4!=null?d.turf4+' %':'—';$('dirtGoal').textContent=d.dirtGoal!=null?d.dirtGoal+' %':'—';$('dirt4').textContent=d.dirt4!=null?d.dirt4+' %':'—';}
function fmt(iso){if(!iso)return '—';return new Date(iso).toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});}
async function loadHistory(){const base=worker();if(!base){$('history').innerHTML='<div class="muted">Worker URLを設定すると履歴が表示されます。</div>';return}try{const r=await fetch(base+'/history?course='+$('course').value,{cache:'no-store'});const d=await r.json();const a=d.history||[];$('history').innerHTML=a.length?a.map(x=>`<div class="hist"><div class="hist-head"><span>${esc(fmt(x.fetchedAt))}　${esc(x.cushion??'—')}</span><span>${esc(x.turf||'—')} / ${esc(x.dirt||'—')}</span></div><div class="hist-meta">芝 ${esc(x.turfGoal??'—')} / ${esc(x.turf4??'—')}　ダート ${esc(x.dirtGoal??'—')} / ${esc(x.dirt4??'—')}　${esc(x.cushionTime?'クッション '+x.cushionTime:'')}</div></div>`).join(''):'<div class="muted">まだ履歴がありません。</div>'}catch(e){$('history').innerHTML='<div class="muted">履歴を取得できません。</div>';}}
async function fetchCurrent(force=false){const base=worker();if(!base){$('status').textContent='Worker URLを設定してください。';return}$('status').textContent='JRA情報を確認中…';$('refresh').disabled=true;try{const path=force?'/refresh':'/';const r=await fetch(base+path+'?course='+encodeURIComponent($('course').value),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();if(d.error)throw new Error(d.error);setData(d);$('status').textContent='最新確認：'+new Date().toLocaleString('ja-JP');await loadHistory()}catch(e){$('status').textContent='取得失敗：'+e.message}finally{$('refresh').disabled=false}}
$('slider').addEventListener('input',()=>$('cushion').textContent=Number($('slider').value).toFixed(1));
$('course').addEventListener('change',()=>{fetchCurrent(false);});
$('refresh').addEventListener('click',()=>fetchCurrent(true));
$('settingsBtn').addEventListener('click',()=>{$('settings').classList.toggle('show');$('workerUrl').value=worker()});
$('saveSettings').addEventListener('click',()=>{const u=$('workerUrl').value.trim().replace(/\/+$/,'');localStorage.setItem('jraWorkerUrl',u);$('settings').classList.remove('show');fetchCurrent(false)});
$('save').addEventListener('click',async()=>{const base=worker();const data=JSON.parse(localStorage.getItem('manualBabaMemo')||'[]');data.unshift({course:COURSE_NAMES[$('course').value],cushion:$('cushion').textContent,turf:$('turf').textContent,dirt:$('dirt').textContent,date:new Date().toISOString(),memo:$('memo').value});localStorage.setItem('manualBabaMemo',JSON.stringify(data.slice(0,100)));$('memo').value='';alert('記録しました。')});
function start(){if(worker()){fetchCurrent(false);timer=setInterval(()=>fetchCurrent(false),15*60*1000)}else{$('status').textContent='設定からCloudflare Worker URLを登録してください。'}}
start();
</script>
</body>
</html>
