<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>馬場メモ UI</title>
<style>
*{box-sizing:border-box}
:root{--bg:#f4f2ee;--card:#fff;--ink:#1e1d1b;--muted:#77726c;--line:#dedad4;--accent:#222}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Noto Sans JP",sans-serif}
.app{width:min(720px,100%);margin:auto;padding:14px 12px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:12px;margin-bottom:10px}
.tabs,.clock,.section-tabs{display:flex;gap:5px}
button{font:inherit}
.tabs button,.clock button,.section-tabs button{flex:1;border:1px solid var(--line);background:#f7f6f4;border-radius:9px;padding:8px 4px;font-size:11px;font-weight:700;cursor:pointer}
button.active{background:#222;color:#fff;border-color:#222}
.info{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.metric{background:#f5f3ef;border-radius:10px;padding:9px 6px;text-align:center}
.metric small{display:block;color:var(--muted);font-size:9px;margin-bottom:3px}.metric b{font-size:15px}
.label{font-size:11px;font-weight:800;margin-bottom:7px}.sub{font-size:9px;color:var(--muted);font-weight:500}
.map-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}
.map-head strong{font-size:14px}.dir{font-size:9px;background:#eeeae4;border-radius:99px;padding:3px 6px;margin-left:5px}
.meta{font-size:9px;color:#625e58}
.course-wrap{position:relative}
svg{display:block;width:100%;height:auto}
.segbtn{position:absolute;border:0;background:#222;color:#fff;border-radius:8px;padding:6px 8px;font-size:9px;font-weight:800;box-shadow:0 1px 4px #0003;cursor:pointer}
.segbtn.front{left:50%;top:27%;transform:translate(-50%,-50%)}
.segbtn.turn{right:5%;top:60%;transform:translateY(-50%)}
.segbtn.back{left:50%;bottom:17%;transform:translate(-50%,50%)}
.section-tabs{margin-top:8px}
.editor{margin-top:9px;border-top:1px solid var(--line);padding-top:9px}
.editor[hidden]{display:none}
.editor-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.editor-head b{font-size:11px}.close{border:0;background:none;font-size:9px;color:var(--muted);cursor:pointer}
.row{display:grid;grid-template-columns:26px 1fr auto;align-items:center;gap:6px;margin:4px 0}
.row.master{grid-template-columns:66px 1fr;margin-bottom:7px}
.row label{font-size:9px;font-weight:800}
input[type=range]{width:100%;margin:0;accent-color:#555}
.grip{display:flex;align-items:center;gap:2px;font-size:8px;color:#555;white-space:nowrap}
.grip input{width:13px;height:13px;margin:0}
.scale{display:grid;grid-template-columns:repeat(5,1fr);font-size:7px;color:#8a857f;margin:0 0 3px 72px;text-align:center}
.scale span:first-child{text-align:left}.scale span:last-child{text-align:right}
.clock-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.clock-title span{font-size:9px;color:var(--muted)}
@media(max-width:480px){
 .app{padding:8px 7px 30px}.card{padding:9px;border-radius:12px}
 .tabs button,.clock button,.section-tabs button{font-size:9px;padding:7px 2px}
 .metric{padding:7px 3px}.metric b{font-size:13px}
 .segbtn{font-size:8px;padding:5px 6px}
 .row{gap:4px}.scale{margin-left:70px}
}

.wind-layer{position:absolute;inset:0;overflow:hidden;pointer-events:none;border-radius:10px}
.wind-particle{
  position:absolute;left:-12%;color:#fff;opacity:.38;font-size:18px;font-weight:900;
  text-shadow:0 1px 3px #0004;
  animation:windDrift 4.2s linear infinite;
}
.wind-particle:nth-child(2){top:24%;animation-delay:-1.1s}
.wind-particle:nth-child(3){top:43%;animation-delay:-2.4s}
.wind-particle:nth-child(4){top:63%;animation-delay:-.4s}
.wind-particle:nth-child(5){top:79%;animation-delay:-3.2s}
.wind-particle:nth-child(1){top:10%}
@keyframes windDrift{
  from{transform:translate(-20px,-10px) rotate(45deg)}
  to{transform:translate(820px,390px) rotate(45deg)}
}
</style>
</head>
<body>
<div class="app">
  <div class="card">
    <div class="tabs" id="trackTabs">
      <button class="active" data-track="東京">東京</button><button data-track="京都">京都</button><button data-track="福島">福島</button>
    </div>
    <div class="info">
      <div class="metric"><small>クッション値</small><b>9.4</b></div>
      <div class="metric"><small>含水率</small><b>12.1%</b></div>
      <div class="metric"><small>馬場状態</small><b>良</b></div>
    </div>
  </div>

  <div class="card">
    <div class="clock-title"><b class="label" style="margin:0">時計レベル</b><span id="clockText">標準</span></div>
    <div class="clock" id="clockButtons">
      <button data-clock="ultrafast">超高速</button><button data-clock="fast">高速</button><button class="active" data-clock="standard">標準</button><button data-clock="slowsome">やや遅</button><button data-clock="slow">遅</button>
    </div>
  </div>

  <div class="card">
    <div class="map-head">
      <div><strong id="courseName">東京 芝コース</strong><span class="dir" id="direction">左回り</span></div>
      <div class="meta">↘ NW 4.2m/s　直線：上り坂</div>
    </div>

    <div class="course-wrap">
      <svg viewBox="0 0 700 430" aria-label="コース図">
        <path d="M185 315 A100 100 0 0 1 185 115 H515 A100 100 0 0 1 515 315 H185" fill="none" stroke="#eee9df" stroke-width="82"/>
        <g id="frontSection"></g><g id="turnSection"></g><g id="backSection"></g>
        <g id="clockMarks" pointer-events="none"></g><g id="gripMarks" pointer-events="none"></g>
      </svg>
      <div class="wind-layer" aria-hidden="true">
        <span class="wind-particle">➜</span><span class="wind-particle">➜</span>
        <span class="wind-particle">➜</span><span class="wind-particle">➜</span>
        <span class="wind-particle">➜</span>
      </div>
      <button class="segbtn front" data-segment="front">道中負荷</button>
      <button class="segbtn turn" data-segment="turn">4角負荷</button>
      <button class="segbtn back" data-segment="back">直線負荷</button>
    </div>

    <div class="section-tabs">
      <button data-segment="front">道中負荷</button><button data-segment="turn">4角負荷</button><button data-segment="back">直線負荷</button>
    </div>

    <div id="editor" class="editor" hidden>
      <div class="editor-head"><b id="editorTitle">道中負荷</b><button class="close" id="closeEditor">閉じる ×</button></div>
      <div id="controls"></div>
    </div>
  </div>
</div>

<script>
const state={
 track:'東京', clock:'standard',
 local:{front:{inner:0,mid:0,outer:0},turn:{inner:0,mid:0,outer:0},back:{inner:0,mid:0,outer:0}},
 grip:{inner:false,mid:false,outer:false},
 active:null
};
const segNames={front:'道中負荷',turn:'4角負荷',back:'直線負荷'};
const laneNames={inner:'内',mid:'中',outer:'外'};
const clockNames={ultrafast:'超高速',fast:'高速',standard:'標準',slowsome:'やや遅',slow:'遅'};
const tracks={東京:'左回り',京都:'右回り',福島:'右回り'};
function color(v){return v<20?'#55a96a':v<40?'#9fc44e':v<60?'#d6c94e':v<80?'#e9a047':'#d6574f'}

function laneRows(seg){
 const s=state.local[seg];
 const grip=lane=>seg==='back'?`<label class="grip"><input type="checkbox" data-grip="${lane}" ${state.grip[lane]?'checked':''}>グリップ</label>`:'';
 return `
 <div class="row master"><label>まとめて</label><input type="range" min="0" max="100" id="master" value="${s.inner===s.mid&&s.mid===s.outer?s.inner:0}"><span></span></div>
 <div class="scale"><span>軽</span><span>25</span><span>50</span><span>75</span><span>重</span></div>
 ${['inner','mid','outer'].map(l=>`<div class="row"><label>${laneNames[l]}</label><input type="range" min="0" max="100" data-lane="${l}" value="${s[l]}">${grip(l)}</div>`).join('')}
 `;
}
function openEditor(seg){
 state.active=seg;
 document.getElementById('editorTitle').textContent=segNames[seg];
 const controls=document.getElementById('controls');
 controls.innerHTML=laneRows(seg);
 document.getElementById('editor').hidden=false;
 document.querySelectorAll('.section-tabs button').forEach(b=>b.classList.toggle('active',b.dataset.segment===seg));
 controls.querySelectorAll('[data-lane]').forEach(r=>r.oninput=()=>{
   state.local[seg][r.dataset.lane]=+r.value; render();
 });
 document.getElementById('master').oninput=e=>{
   const v=+e.target.value;
   ['inner','mid','outer'].forEach(l=>state.local[seg][l]=v);
   controls.querySelectorAll('[data-lane]').forEach(r=>r.value=v);
   render();
 };
 controls.querySelectorAll('[data-grip]').forEach(c=>c.onchange=()=>{
   state.grip[c.dataset.grip]=c.checked; render();
 });
}
function closeEditor(){
 document.getElementById('editor').hidden=true;state.active=null;
 document.querySelectorAll('.section-tabs button').forEach(b=>b.classList.remove('active'));
}
function renderSection(id,seg){
 const s=state.local[seg],g=document.getElementById(id);let x='';
 if(seg==='front'){
  x+=`<path d="M185 341 A126 126 0 0 1 185 89 H515 A126 126 0 0 1 641 215" fill="none" stroke="${color(s.outer)}" stroke-width="26"/>`;
  x+=`<path d="M185 315 A100 100 0 0 1 185 115 H515 A100 100 0 0 1 615 215" fill="none" stroke="${color(s.mid)}" stroke-width="26"/>`;
  x+=`<path d="M185 289 A74 74 0 0 1 185 141 H515 A74 74 0 0 1 589 215" fill="none" stroke="${color(s.inner)}" stroke-width="26"/>`;
 }else if(seg==='turn'){
  x+=`<path d="M641 215 A126 126 0 0 1 515 341" fill="none" stroke="${color(s.outer)}" stroke-width="26"/>`;
  x+=`<path d="M615 215 A100 100 0 0 1 515 315" fill="none" stroke="${color(s.mid)}" stroke-width="26"/>`;
  x+=`<path d="M589 215 A74 74 0 0 1 515 289" fill="none" stroke="${color(s.inner)}" stroke-width="26"/>`;
 }else{
  x+=`<path d="M515 289 H185" stroke="${color(s.inner)}" stroke-width="26"/>`;
  x+=`<path d="M515 315 H185" stroke="${color(s.mid)}" stroke-width="26"/>`;
  x+=`<path d="M515 341 H185" stroke="${color(s.outer)}" stroke-width="26"/>`;
 }
 g.innerHTML=x;
}
function renderClock(){
 const g=document.getElementById('clockMarks');
 const pts=[
   [245,115,0],[350,115,0],[455,115,0],
   [605,180,65],[575,290,120],
   [455,315,180],[350,315,180],[245,315,180],
   [120,260,245],[120,165,295]
 ];
 function mark(x,y,r){
   const common=`stroke="white" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".32"`;
   let shape='';
   if(state.clock==='ultrafast'){
     shape=`<path d="M-14 -44 L12 0 L-14 44 M0 -44 L26 0 L0 44" ${common}/>`;
   }else if(state.clock==='fast'){
     shape=`<path d="M-12 -44 L16 0 L-12 44" ${common}/>`;
   }else if(state.clock==='standard'){
     shape=`<path d="M0 -44 L0 44" ${common}/>`;
   }else if(state.clock==='slowsome'){
     shape=`<path d="M0 -44 C-10 -30 10 -15 0 0 C-10 15 10 30 0 44" ${common}/>`;
   }else{
     shape=`<path d="M-6 -44 C-16 -30 4 -15 -6 0 C-16 15 4 30 -6 44
                     M6 -44 C-4 -30 16 -15 6 0 C-4 15 16 30 6 44" ${common}/>`;
   }
   return `<g transform="translate(${x} ${y}) rotate(${r})">${shape}</g>`;
 }
 g.innerHTML=pts.map(p=>mark(...p)).join('');
}
function renderGrip(){
 const g=document.getElementById('gripMarks'),ys={inner:289,mid:315,outer:341};
 let a=[];
 // 東京のホームストレッチは右→左。時計レベルと区別するため太い単矢印を使用。
 Object.keys(ys).forEach(l=>{
   if(state.grip[l]){
     [470,400,330,260,200].forEach(x=>{
       a.push(`<g transform="translate(${x} ${ys[l]})">
         <line x1="10" y1="0" x2="-7" y2="0" stroke="white" stroke-width="4.5" stroke-linecap="round" opacity=".92"/>
         <path d="M-7 0 L0 -7 M-7 0 L0 7" fill="none" stroke="white" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" opacity=".92"/>
       </g>`);
     });
   }
 });
 g.innerHTML=a.join('');
}
function render(){
 renderSection('frontSection','front');renderSection('turnSection','turn');renderSection('backSection','back');renderClock();renderGrip();
}
document.querySelectorAll('[data-segment]').forEach(b=>b.addEventListener('click',()=>openEditor(b.dataset.segment)));
document.getElementById('closeEditor').addEventListener('click',closeEditor);
document.querySelectorAll('#clockButtons button').forEach(b=>b.addEventListener('click',()=>{
 state.clock=b.dataset.clock;document.getElementById('clockText').textContent=clockNames[state.clock];
 document.querySelectorAll('#clockButtons button').forEach(x=>x.classList.toggle('active',x===b));renderClock();
}));
document.querySelectorAll('#trackTabs button').forEach(b=>b.addEventListener('click',()=>{
 state.track=b.dataset.track;document.getElementById('courseName').textContent=state.track+' 芝コース';document.getElementById('direction').textContent=tracks[state.track];
 document.querySelectorAll('#trackTabs button').forEach(x=>x.classList.toggle('active',x===b));
}));
render();
</script>
</body>
</html>
