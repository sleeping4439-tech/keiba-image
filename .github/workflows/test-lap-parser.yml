name: Validate lap parser
on:
  push:
    paths:
      - 'scripts/parse-jra-laps.mjs'
      - 'scripts/parse-jra-laps.test.mjs'
      - 'scripts/build-laps.mjs'
      - 'scripts/build-laps.test.mjs'
      - '.github/workflows/test-lap-parser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/*.test.mjs
