name: Update Yubaroku race histories
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python scripts/update_yubaroku_history.py
      - name: Commit changed feed
        run: |
          if git diff --quiet -- yubaroku/race-history.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yubaroku/race-history.json
          git commit -m "Refresh Yubaroku race histories"
          git push
