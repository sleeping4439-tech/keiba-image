name: Update Yubaroku race histories
on:
  workflow_dispatch:
    inputs:
      horse_names:
        description: '追加取得する馬名（改行・カンマ区切り、登録馬まとめて指定可）'
        required: false
        type: string
  schedule:
    - cron: '35 20 * * 1'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python scripts/update_yubaroku_history.py
        env:
          YUBAROKU_HORSE_NAMES: ${{ inputs.horse_names }}
      - name: Commit changed feed
        run: |
          if git diff --quiet -- yubaroku/race-history.json && [ ! -f yubaroku/history-targets.json ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yubaroku/race-history.json yubaroku/history-targets.json
          git commit -m "Refresh Yubaroku race histories"
          git push
