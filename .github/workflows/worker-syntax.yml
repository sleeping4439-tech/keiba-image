name: Worker syntax check
on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/worker.js'
      - '.github/workflows/worker-syntax.yml'
  pull_request:
    paths:
      - 'cloudflare/worker.js'
      - '.github/workflows/worker-syntax.yml'
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Worker JavaScript syntax
        run: node --check cloudflare/worker.js
