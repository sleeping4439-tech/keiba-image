name: Archive verified JRA data
on:
  workflow_dispatch:
  schedule:
    - cron: '17 0,3,6,9 * * 5,6,0'
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/archive-data.mjs
        env:
          WORKER_URL: https://keiba-track-data.sleeping4439.workers.dev/latest
      - run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard data)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/history
          git commit -m "Archive verified measurements"
          git push
