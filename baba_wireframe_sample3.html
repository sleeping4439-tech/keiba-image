<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日の馬場メモ - デザインサンプル</title>
<style>
:root{
  --bg:#f7f6f3;
  --card:#fff;
  --ink:#292724;
  --muted:#8b8781;
  --line:#e5e1db;
  --accent:#302d29;
  --green:#48a868;
  --yellow:#d7c84d;
  --orange:#e9a047;
  --red:#d85a4f;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Yu Gothic",YuGothic,Arial,sans-serif;
}
button,input{font:inherit}
button{cursor:pointer}
.app{
  width:min(720px,100%);
  margin:auto;
  padding:28px 18px 80px;
}
h1{
  text-align:center;
  font-size:26px;
  font-weight:500;
  letter-spacing:.06em;
  margin:0 0 32px;
}
.section{margin-bottom:30px}
.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:14px;
}
.section-title h2{
  margin:0;
  font-size:19px;
  font-weight:600;
  letter-spacing:.02em;
}
.section-title .sub{
  color:var(--muted);
  font-size:11px;
}

/* track selector */
.track-select{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}
.track-tabs{
  display:flex;
  padding:3px;
  background:#d3d0cb;
  border-radius:8px;
}
.track-tabs button{
  border:0;
  background:transparent;
  min-width:76px;
  padding:6px 13px;
  border-radius:5px;
  color:#383531;
  font-size:14px;
}
.track-tabs button.active{
  background:#302d29;
  color:#fff;
}

/* overall info */
.info-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
}
.info-card{
  background:#fff;
  border:1px solid #ece9e4;
  border-radius:12px;
  padding:12px 13px;
  box-shadow:0 2px 8px rgba(40,35,30,.025);
}
.info-card .label{font-size:10px;color:#9a9690;margin-bottom:5px}
.info-card .value{font-size:19px;font-weight:600}

.control-block{
  margin-top:20px;
  background:#fff;
  border:1px solid #ece9e4;
  border-radius:13px;
  padding:15px 16px;
}
.control-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:9px;
}
.control-head strong{font-size:14px}
.control-head .current{font-size:15px;font-weight:700}
.range{
  width:100%;
  height:5px;
  appearance:none;
  border-radius:10px;
  background:linear-gradient(90deg,#55a96a 0%,#d6c94e 50%,#d6574f 100%);
  outline:none;
}
.range::-webkit-slider-thumb{
  appearance:none;
  width:17px;height:17px;border-radius:50%;
  background:#4d4a46;
  box-shadow:0 1px 4px rgba(0,0,0,.22);
}
.range::-moz-range-thumb{
  width:17px;height:17px;border-radius:50%;border:0;background:#4d4a46;
}
.scale{
  display:flex;justify-content:space-between;
  color:#9b9790;font-size:9px;margin-top:5px;
}
.grip-wrap{margin-top:18px}
.grip-buttons{
  display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
}
.grip-buttons button{
  height:42px;border-radius:9px;border:1px solid #ddd8d1;
  background:#f8f6f3;color:#383531;font-weight:600;
}
.grip-buttons button.active{
  background:#302d29;color:#fff;border-color:#302d29;
}

/* summary course */
.summary-card{
  background:#fff;
  border:1px solid #ebe7e1;
  border-radius:16px;
  padding:14px 15px 10px;
  box-shadow:0 4px 16px rgba(40,35,30,.035);
}
.summary-stage{
  position:relative;
  height:275px;
}
.summary-svg{width:100%;height:100%}
.map-pill{
  position:absolute;
  padding:5px 8px;
  background:#f4f2ee;
  border:1px solid #e8e4de;
  border-radius:6px;
  font-size:10px;
  color:#4b4742;
}
.wind{left:10%;top:24%}
.slope{right:8%;top:22%}
.start{left:8%;top:48%}
.goal{right:7%;top:48%}
.summary-foot{
  border-top:1px solid #eeeae5;
  padding-top:8px;
  color:#aaa59e;
  font-size:10px;
}

/* interactive course */
.map-card{
  background:#fff;
  border:1px solid #ebe7e1;
  border-radius:16px;
  padding:15px 13px 12px;
  box-shadow:0 4px 16px rgba(40,35,30,.035);
}
.map-header{
  display:flex;justify-content:space-between;align-items:center;
  padding:0 5px 5px;
}
.map-header strong{font-size:14px}
.map-header span{font-size:10px;color:#aaa59e}
.course-editor{
  position:relative;
  width:100%;
  aspect-ratio:1.42;
}
.course-svg{width:100%;height:100%}
.segment-button{
  position:absolute;
  border:0;
  background:#302d29;
  color:#fff;
  border-radius:5px;
  padding:7px 11px;
  font-size:10px;
  box-shadow:0 3px 8px rgba(0,0,0,.16);
  transition:.15s;
}
.segment-button:hover{transform:translateY(-1px);background:#1f1d1b}
.segment-button.front{left:50%;top:26%;transform:translate(-50%,-50%)}
.segment-button.turn{right:6%;top:50%;transform:translateY(-50%)}
.segment-button.back{left:50%;bottom:7%;transform:translate(-50%,50%)}
.segment-button.front:hover{transform:translate(-50%,calc(-50% - 1px))}
.segment-button.turn:hover{transform:translateY(calc(-50% - 1px))}
.segment-button.back:hover{transform:translate(-50%,calc(50% - 1px))}

.legend{
  display:flex;justify-content:center;gap:16px;
  color:#77736d;font-size:10px;padding-top:3px;
}
.legend span{display:flex;align-items:center;gap:5px}
.dot{width:9px;height:9px;border-radius:2px}
.dot.inner{background:var(--green)}
.dot.mid{background:var(--orange)}
.dot.outer{background:var(--red)}

/* popup */
.modal-bg{
  position:fixed;inset:0;
  display:none;align-items:center;justify-content:center;
  padding:18px;
  background:rgba(28,25,22,.42);
  z-index:50;
  backdrop-filter:blur(2px);
}
.modal-bg.show{display:flex}
.modal{
  width:min(440px,100%);
  background:#fff;
  border-radius:18px;
  box-shadow:0 18px 60px rgba(0,0,0,.22);
  overflow:hidden;
  animation:pop .16s ease-out;
}
@keyframes pop{
  from{opacity:0;transform:translateY(8px) scale(.98)}
  to{opacity:1;transform:none}
}
.modal-head{
  padding:18px 20px 14px;
  border-bottom:1px solid #eeeae5;
  display:flex;justify-content:space-between;align-items:center;
}
.modal-head h3{margin:0;font-size:18px;font-weight:600}
.close{
  border:0;background:#f2f0ed;width:30px;height:30px;border-radius:50%;
  font-size:18px;color:#666;line-height:1;
}
.modal-body{padding:17px 20px 18px}
.modal-note{font-size:11px;color:#99948e;margin-bottom:16px;line-height:1.6}
.lane-control{
  border:1px solid #e9e5df;
  border-radius:11px;
  padding:11px 12px 12px;
  margin-bottom:9px;
}
.lane-head{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:8px;
}
.lane-name{
  display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600
}
.lane-chip{width:8px;height:8px;border-radius:50%}
.lane-chip.inner{background:var(--green)}
.lane-chip.mid{background:var(--orange)}
.lane-chip.outer{background:var(--red)}
.lane-number{font-size:13px;font-weight:700}
.local-range{
  width:100%;height:5px;appearance:none;border-radius:10px;
  background:linear-gradient(90deg,#55a96a 0%,#d6c94e 50%,#d6574f 100%);
}
.local-range::-webkit-slider-thumb{
  appearance:none;width:15px;height:15px;border-radius:50%;
  background:#4d4a46;box-shadow:0 1px 3px rgba(0,0,0,.2)
}
.local-range::-moz-range-thumb{
  width:15px;height:15px;border:0;border-radius:50%;background:#4d4a46
}
.modal-scale{
  display:flex;justify-content:space-between;color:#aaa59e;font-size:9px;margin-top:4px
}
.modal-foot{
  display:flex;justify-content:flex-end;gap:8px;
  padding:12px 20px 17px;
  background:#faf9f7;border-top:1px solid #eeeae5;
}
.modal-foot button{
  border-radius:8px;padding:9px 17px;border:1px solid #dcd7d0;background:#fff;
  font-size:13px;
}
.modal-foot .save{background:#302d29;border-color:#302d29;color:#fff}

/* result animation */
.result-course{margin-top:16px}
.result-label{
  font-size:12px;color:#7d7973;margin:0 5px 5px;
}

/* mobile */
@media(max-width:580px){
  .app{padding:22px 12px 60px}
  h1{font-size:23px;margin-bottom:25px}
  .track-select{align-items:flex-start;flex-direction:column}
  .track-tabs{width:100%}
  .track-tabs button{flex:1;min-width:0}
  .info-card{padding:10px}
  .info-card .value{font-size:17px}
  .summary-stage{height:220px}
  .course-editor{aspect-ratio:1.25}
  .segment-button{font-size:9px;padding:6px 8px}
  .segment-button.turn{right:2%}
}
</style>
</head>

<body>
<div class="app">
  <h1>今日の馬場メモ</h1>

  <section class="section">
    <div class="section-title track-select">
      <h2>今日の馬場・全体傾向</h2>
      <div class="track-tabs">
        <button class="active" data-track="東京">東京</button>
        <button data-track="京都">京都</button>
        <button data-track="福島">福島</button>
      </div>
    </div>

    <div class="info-grid">
      <div class="info-card"><div class="label">クッション値</div><div class="value">9.2</div></div>
      <div class="info-card"><div class="label">含水率</div><div class="value">12.8%</div></div>
      <div class="info-card"><div class="label">馬場状態</div><div class="value">良</div></div>
    </div>

    <div class="control-block">
      <div class="control-head"><strong>負荷</strong><span class="current" id="loadValue">72</span></div>
      <input class="range" id="overallLoad" type="range" min="0" max="100" value="72">
      <div class="scale"><span>軽</span><span>25</span><span>50</span><span>75</span><span>重</span></div>

      <div class="grip-wrap">
        <div class="control-head"><strong>グリップ</strong><span class="current" id="gripValue">なし</span></div>
        <div class="grip-buttons">
          <button data-grip="strong">&lt;&lt;</button>
          <button data-grip="mid">&lt;</button>
          <button class="active" data-grip="none">なし</button>
        </div>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="section-title"><h2>コース全体</h2></div>
    <div class="summary-card">
      <div class="summary-stage">
        <div class="map-pill wind">↘ NW 4.2m/s</div>
        <div class="map-pill slope">直線：上り坂</div>
        <div class="map-pill start">START</div>
        <div class="map-pill goal">GOAL</div>
        <svg class="summary-svg" viewBox="0 0 700 260">
          <defs>
            <pattern id="sumGripStrong" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(135)">
              <line x1="0" y1="0" x2="0" y2="18" stroke="#fff" stroke-width="4" opacity=".55"/>
            </pattern>
            <pattern id="sumGripMid" width="34" height="34" patternUnits="userSpaceOnUse" patternTransform="rotate(135)">
              <line x1="0" y1="0" x2="0" y2="34" stroke="#fff" stroke-width="4" opacity=".55"/>
            </pattern>
          </defs>
          <ellipse id="summaryTrack" cx="350" cy="132" rx="250" ry="72"
                   fill="none" stroke="#e5a044" stroke-width="22"/>
          <ellipse id="summaryGrip" cx="350" cy="132" rx="250" ry="72"
                   fill="none" stroke="url(#sumGripMid)" stroke-width="22" opacity="0"/>
        </svg>
      </div>
      <div class="summary-foot">風向・コース形状など、コース全体の情報。</div>
    </div>
  </section>

  <section class="section">
    <div class="section-title">
      <h2>コース全体</h2>
      <span class="sub">各区間をタップして内・中・外を設定</span>
    </div>

    <div class="map-card">
      <div class="map-header">
        <strong>東京 芝コース</strong>
        <span>設定内容は下の図に反映</span>
      </div>

      <div class="course-editor">
        <svg class="course-svg" viewBox="0 0 700 430">
          <defs>
            <pattern id="editorGripStrong" width="19" height="19" patternUnits="userSpaceOnUse" patternTransform="rotate(135)">
              <line x1="0" y1="0" x2="0" y2="19" stroke="#111" stroke-width="3" opacity=".55"/>
            </pattern>
            <pattern id="editorGripMid" width="34" height="34" patternUnits="userSpaceOnUse" patternTransform="rotate(135)">
              <line x1="0" y1="0" x2="0" y2="34" stroke="#111" stroke-width="3" opacity=".55"/>
            </pattern>
          </defs>

          <!-- overall base -->
          <path d="M185 115 H515 A100 100 0 0 1 515 315 H185 A100 100 0 0 1 185 115 Z"
                fill="none" stroke="#e5a044" stroke-width="78"/>

          <!-- three local sections: outer -> middle -> inner -->
          <g id="frontSection"></g>
          <g id="turnSection"></g>
          <g id="backSection"></g>

          <!-- subtle section separators -->
          <line x1="185" y1="76" x2="185" y2="154" stroke="#817c75" stroke-width="1"/>
          <line x1="515" y1="76" x2="515" y2="154" stroke="#817c75" stroke-width="1"/>
          <line x1="185" y1="276" x2="185" y2="354" stroke="#817c75" stroke-width="1"/>
          <line x1="515" y1="276" x2="515" y2="354" stroke="#817c75" stroke-width="1"/>
        </svg>

        <button class="segment-button front" data-seg="front">向正面内外</button>
        <button class="segment-button turn" data-seg="turn">4角内外</button>
        <button class="segment-button back" data-seg="back">直線内外</button>
      </div>

      <div class="legend">
        <span><i class="dot inner"></i>内</span>
        <span><i class="dot mid"></i>中</span>
        <span><i class="dot outer"></i>外</span>
      </div>
    </div>
  </section>

  <section class="section result-course">
    <div class="section-title">
      <h2>馬場マップ</h2>
      <span class="sub">設定結果</span>
    </div>
    <div class="map-card">
      <div class="course-editor">
        <svg id="resultSvg" class="course-svg" viewBox="0 0 700 430">
          <defs>
            <pattern id="resultGripStrong" width="19" height="19" patternUnits="userSpaceOnUse" patternTransform="rotate(135)">
              <line x1="0" y1="0" x2="0" y2="19" stroke="#111" stroke-width="3" opacity=".5"/>
            </pattern>
            <pattern id="resultGripMid" width="34" height="34" patternUnits="userSpaceOnUse" patternTransform="rotate(135)">
              <line x1="0" y1="0" x2="0" y2="34" stroke="#111" stroke-width="3" opacity=".5"/>
            </pattern>
          </defs>
          <path d="M185 115 H515 A100 100 0 0 1 515 315 H185 A100 100 0 0 1 185 115 Z"
                fill="none" stroke="#e5a044" stroke-width="78"/>
          <g id="resultFront"></g>
          <g id="resultTurn"></g>
          <g id="resultBack"></g>
          <line x1="185" y1="76" x2="185" y2="154" stroke="#817c75"/>
          <line x1="515" y1="76" x2="515" y2="154" stroke="#817c75"/>
          <line x1="185" y1="276" x2="185" y2="354" stroke="#817c75"/>
          <line x1="515" y1="276" x2="515" y2="354" stroke="#817c75"/>
        </svg>
      </div>
      <div class="legend">
        <span><i class="dot inner"></i>内</span>
        <span><i class="dot mid"></i>中</span>
        <span><i class="dot outer"></i>外</span>
      </div>
    </div>
  </section>
</div>

<!-- local setting popup -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modalTitle">直線の内外差</h3>
      <button class="close" id="closeModal">×</button>
    </div>
    <div class="modal-body">
      <div class="modal-note">
        内・中・外それぞれの「負荷」を横棒で設定します。<br>
        設定すると、この区間のコース図に色として反映されます。
      </div>

      <div id="laneControls"></div>
    </div>
    <div class="modal-foot">
      <button id="cancelModal">キャンセル</button>
      <button class="save" id="saveModal">反映する</button>
    </div>
  </div>
</div>

<script>
const state = {
  track:'東京',
  overallLoad:72,
  grip:'none',
  local:{
    front:{inner:25,mid:50,outer:75},
    turn:{inner:25,mid:50,outer:75},
    back:{inner:25,mid:50,outer:75}
  }
};

const segmentNames = {
  front:'向正面の内外差',
  turn:'4角の内外差',
  back:'直線の内外差'
};

const laneNames = {inner:'内',mid:'中',outer:'外'};

function color(v){
  if(v < 20) return '#55a96a';
  if(v < 40) return '#9fc44e';
  if(v < 60) return '#d6c94e';
  if(v < 80) return '#e9a047';
  return '#d6574f';
}

function laneGroupHTML(id, lane, value){
  return `
    <div class="lane-control">
      <div class="lane-head">
        <div class="lane-name">
          <i class="lane-chip ${lane}"></i>${laneNames[lane]}
        </div>
        <span class="lane-number" id="${id}-${lane}-number">${value}</span>
      </div>
      <input class="local-range" data-lane="${lane}" id="${id}-${lane}-range"
             type="range" min="0" max="100" value="${value}">
      <div class="modal-scale"><span>軽</span><span>25</span><span>50</span><span>75</span><span>重</span></div>
    </div>`;
}

let currentSegment = null;
let draft = null;

function openModal(segment){
  currentSegment = segment;
  draft = {...state.local[segment]};
  document.getElementById('modalTitle').textContent = segmentNames[segment];

  const holder = document.getElementById('laneControls');
  holder.innerHTML =
    laneGroupHTML(segment,'inner',draft.inner) +
    laneGroupHTML(segment,'mid',draft.mid) +
    laneGroupHTML(segment,'outer',draft.outer);

  holder.querySelectorAll('.local-range').forEach(input=>{
    input.addEventListener('input', e=>{
      const lane = e.target.dataset.lane;
      draft[lane] = Number(e.target.value);
      document.getElementById(`${segment}-${lane}-number`).textContent = draft[lane];
    });
  });

  document.getElementById('modalBg').classList.add('show');
}

function closeModal(){
  document.getElementById('modalBg').classList.remove('show');
  currentSegment = null;
  draft = null;
}

document.querySelectorAll('.segment-button').forEach(btn=>{
  btn.addEventListener('click',()=>openModal(btn.dataset.seg));
});
document.getElementById('closeModal').addEventListener('click',closeModal);
document.getElementById('cancelModal').addEventListener('click',closeModal);

document.getElementById('saveModal').addEventListener('click',()=>{
  if(!currentSegment) return;
  state.local[currentSegment] = {...draft};
  renderAllCourseMaps();
  closeModal();
});

document.getElementById('modalBg').addEventListener('click',e=>{
  if(e.target.id==='modalBg') closeModal();
});

/* SVG lane renderer
   Three concentric strokes form the outer/middle/inner lanes.
   A separate path is used for each section so each popup affects only its own section.
*/
function pathFor(seg){
  if(seg==='front') return 'M185 115 H515';
  if(seg==='turn') return 'M515 115 A100 100 0 0 1 515 315';
  return 'M515 315 H185';
}

function renderLaneSection(containerId, seg, patternPrefix){
  const g = document.getElementById(containerId);
  const s = state.local[seg];
  const d = pathFor(seg);

  /*
    3色表示：
    コース幅78pxを内・中・外の3レーン（各26px）に分ける。
    直線は stroke の中心を上下にずらして3本を隣接させる。
    4角は同じ考え方でカーブに沿わせるため、
    path を3本重ね、中心線から半径方向に見えるように描く。
  */
  let svg = '';

  if(seg === 'front'){
    // 向正面：画面上側のレーンが外、下側が内
    svg += `<path d="${d}" fill="none" stroke="${color(s.outer)}" stroke-width="26" transform="translate(0 -26)"/>`;
    svg += `<path d="${d}" fill="none" stroke="${color(s.mid)}" stroke-width="26"/>`;
    svg += `<path d="${d}" fill="none" stroke="${color(s.inner)}" stroke-width="26" transform="translate(0 26)"/>`;
  } else if(seg === 'back'){
    // 最終直線：画面上側のレーンが内、下側が外
    svg += `<path d="${d}" fill="none" stroke="${color(s.inner)}" stroke-width="26" transform="translate(0 -26)"/>`;
    svg += `<path d="${d}" fill="none" stroke="${color(s.mid)}" stroke-width="26"/>`;
    svg += `<path d="${d}" fill="none" stroke="${color(s.outer)}" stroke-width="26" transform="translate(0 26)"/>`;
  } else {
    // 4角：カーブの外側→内側を3色で表現
    // ベースの78px幅を3本の帯で構成し、隣接して見えるようにする。
    svg += `<path d="${d}" fill="none" stroke="${color(s.outer)}" stroke-width="26" transform="translate(26 0)"/>`;
    svg += `<path d="${d}" fill="none" stroke="${color(s.mid)}" stroke-width="26"/>`;
    svg += `<path d="${d}" fill="none" stroke="${color(s.inner)}" stroke-width="26" transform="translate(-26 0)"/>`;
  }

  if(state.grip !== 'none'){
    const pattern = state.grip === 'strong'
      ? `url(#${patternPrefix}GripStrong)`
      : `url(#${patternPrefix}GripMid)`;
    svg += `<path d="${d}" fill="none" stroke="${pattern}" stroke-width="78" opacity=".22"/>`;
  }

  g.innerHTML = svg;
}

function renderSection(containerId, seg){
  renderLaneSection(containerId, seg, 'editor');
}

function renderResultSection(containerId, seg){
  renderLaneSection(containerId, seg, 'result');
}

/* overall */
const overallLoad = document.getElementById('overallLoad');
overallLoad.addEventListener('input',()=>{
  state.overallLoad = Number(overallLoad.value);
  document.getElementById('loadValue').textContent = state.overallLoad;
  document.getElementById('summaryTrack').setAttribute('stroke',color(state.overallLoad));
  renderAllCourseMaps();
});

document.querySelectorAll('.grip-buttons button').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.grip-buttons button').forEach(x=>x.classList.remove('active'));
    btn.classList.add('active');
    state.grip = btn.dataset.grip;
    document.getElementById('gripValue').textContent = btn.textContent;
    const p = document.getElementById('summaryGrip');
    p.setAttribute('opacity',state.grip==='none'?'0':'.68');
    p.setAttribute('stroke',state.grip==='strong'?'url(#sumGripStrong)':'url(#sumGripMid)');
    renderAllCourseMaps();
  });
});

/* track tabs - mock values for this visual sample */
const mock = {
  東京:['9.2','12.8%','良'],
  京都:['9.0','14.1%','良'],
  福島:['8.7','16.0%','稍重']
};
document.querySelectorAll('.track-tabs button').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.track-tabs button').forEach(x=>x.classList.remove('active'));
    btn.classList.add('active');
    state.track=btn.dataset.track;
    const vals=mock[state.track];
    document.querySelectorAll('.info-card .value').forEach((el,i)=>el.textContent=vals[i]);
  });
});

document.getElementById('loadValue').textContent=state.overallLoad;
document.getElementById('summaryTrack').setAttribute('stroke',color(state.overallLoad));
renderAllCourseMaps();
</script>
