<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>当日ラップ一覧｜ゆ馬場</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#242424;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif}
main{max-width:960px;margin:auto;padding:24px 18px 80px}h1{font-size:26px;color:#245b3b;margin:0 0 6px}p{line-height:1.65}.muted{color:#777;font-size:13px}.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin:24px 0 16px}label{display:flex;flex-direction:column;gap:7px;font-size:13px;font-weight:700}select,input,textarea{font:inherit;border:1px solid #cbd4ce;border-radius:9px;padding:10px;background:#fff;color:#242424}summary{cursor:pointer;font-weight:700;color:#245b3b;padding:4px 0}button{border:0;border-radius:9px;background:#245b3b;color:white;padding:11px 15px;cursor:pointer;font:inherit;font-weight:700}button.secondary{background:#f0f3f0;color:#315a40}button.danger{background:#fff;color:#a33;border:1px solid #e3c8c8}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #4da86b;outline-offset:2px}.panel{border:1px solid #e1e7e1;border-radius:15px;padding:18px;margin:18px 0;box-shadow:0 3px 14px #00000008}.panel h2{font-size:18px;margin:0 0 12px}.formgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.formgrid input,.formgrid select{width:100%}textarea{width:100%;min-height:105px;resize:vertical;margin-top:12px}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}th,td{padding:12px 10px;text-align:right;border-bottom:1px solid #e9e9e9;font-variant-numeric:tabular-nums}th{font-size:12px;color:#777;background:#f7f9f7}th:first-child,td:first-child{text-align:left}tbody tr{cursor:pointer}tbody tr:hover{background:#f5faf6}.pill{display:inline-block;background:#e8f3eb;border-radius:7px;padding:3px 7px;color:#326849}.empty{padding:28px 12px;text-align:center;color:#888}.detail{background:#f7faf7;border-radius:12px;padding:15px;margin-top:16px}.laps{display:grid;grid-template-columns:repeat(auto-fit,minmax(65px,1fr));gap:6px}.lap{background:#fff;border:1px solid #e1e7e1;border-radius:7px;text-align:center;padding:10px 4px}.lap small{display:block;color:#888;margin-bottom:5px}.note{font-size:12px;color:#777;line-height:1.7}#status{min-height:1.4em;color:#245b3b;font-size:13px}a{color:#397451} .sub{font-size:12px;color:#888}
@media(max-width:650px){main{padding:16px 10px 60px}h1{font-size:23px}.formgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.panel{padding:13px}th,td{padding:10px 8px;font-size:13px}}
</style></head><body><main>
<h1>当日ラップ一覧</h1><p class="muted">芝レースの決着時計と全体ラップを比較するための個人用ページ</p>
<div class="controls"><label>競馬場<select id="track"><option>東京</option><option>京都</option><option>中山</option><option>阪神</option><option>中京</option><option>新潟</option><option>福島</option><option>小倉</option><option>札幌</option><option>函館</option></select></label><label>開催日<input type="date" id="day"></label></div>
<section class="panel"><h2 id="listTitle">芝レース一覧</h2><p class="muted">競馬場と日付を選ぶだけで、公開済みの芝レース結果を自動表示します。データ未収録の日付はその旨を表示します。</p><div class="tablewrap"><table><thead><tr><th>R</th><th>芝距離</th><th>馬場</th><th>勝ち時計</th><th>前半3F</th><th>後半3F</th><th>後半−前半</th></tr></thead><tbody id="rows"></tbody></table></div><div id="detail"></div></section>
<p class="note">※前後半3Fは各200mラップの先頭3区間・末尾3区間を合計。レース全体のラップであり、勝ち馬個別の推定上りではありません。距離が1200mを超える場合、前後半3Fの合計は勝ち時計と一致しません。<br>※レース結果の収集・更新処理は別途必要です。現在、取得済みデータがない日付は表示されません。<br>出典確認：<a href="https://www.jra.go.jp/JRADB/accessS.html" target="_blank" rel="noopener noreferrer">JRA公式レース結果</a></p>
</main><script>
(()=>{'use strict';
const $=id=>document.getElementById(id),track=$('track'),day=$('day'),rows=$('rows'),title=$('listTitle'),detail=$('detail');
const d=new Date();day.value=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const p=new URLSearchParams(location.search);if(p.has('track')&&[...track.options].some(o=>o.value===p.get('track')))track.value=p.get('track');if(/^\d{4}-\d{2}-\d{2}$/.test(p.get('date')||''))day.value=p.get('date');
const fmt=x=>Number(x).toFixed(1),round=x=>Math.round(x*10)/10;let seq=0;
function notice(message){rows.replaceChildren();detail.replaceChildren();const tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=7;td.className='empty';td.textContent=message;tr.append(td);rows.append(tr)}
function show(x){detail.replaceChildren();const box=document.createElement('div');box.className='detail';const h=document.createElement('h3');h.textContent=x.race+'R｜芝'+x.distance+'m｜'+x.finish;box.append(h);const laps=document.createElement('div');laps.className='laps';x.laps.forEach((v,i)=>{const b=document.createElement('div');b.className='lap';const sm=document.createElement('small');sm.textContent=(i+1)*200+'m';b.append(sm,document.createTextNode(fmt(v)));laps.append(b)});box.append(laps);detail.append(box)}
function valid(x){return x&&Number.isInteger(x.race)&&x.race>=1&&x.race<=12&&Number.isInteger(x.distance)&&x.distance>=800&&x.distance<=4000&&x.distance%200===0&&/^\d+:\d{2}\.\d$/.test(x.finish)&&Array.isArray(x.laps)&&x.laps.length===x.distance/200&&x.laps.every(n=>Number.isFinite(n)&&n>=9&&n<=25)}
async function render(){const id=++seq;title.textContent=track.value+'｜'+day.value+'｜芝レース一覧';notice('芝レース結果を読み込み中…');
try{const res=await fetch('./data/laps/'+day.value+'.json',{cache:'no-store'});if(id!==seq)return;if(res.status===404){notice('この日のラップデータはまだ公開されていません。');return}if(!res.ok)throw Error('HTTP '+res.status);const json=await res.json();if(id!==seq)return;if(json.date!==day.value||!Array.isArray(json.races))throw Error('データ形式が不正です');const items=json.races.filter(x=>x.track===track.value&&x.surface==='芝'&&valid(x)).sort((a,b)=>a.race-b.race);if(!items.length){notice('この日の芝レース結果は登録されていません。');return}rows.replaceChildren();for(const x of items){const front=round(x.laps.slice(0,3).reduce((a,b)=>a+b,0)),back=round(x.laps.slice(-3).reduce((a,b)=>a+b,0));const tr=document.createElement('tr');for(const v of [x.race+'R',x.distance+'m',x.going||'—',x.finish,fmt(front),fmt(back),(back-front>=0?'+':'')+fmt(round(back-front))]){const td=document.createElement('td');td.textContent=v;tr.append(td)}tr.tabIndex=0;tr.setAttribute('role','button');tr.setAttribute('aria-label',x.race+'Rのラップ詳細');tr.onclick=()=>show(x);tr.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();show(x)}};rows.append(tr)}const caption=document.createElement('p');caption.className='note';caption.textContent='データ更新：'+(json.updatedAt||'不明')+' ／ 出典：'+(json.source||'未設定');detail.append(caption);
}catch(e){if(id===seq)notice('データの読み込みに失敗しました。時間をおいて再度お試しください。')}}
track.onchange=render;day.onchange=render;render();
})();
</script></body></html>
