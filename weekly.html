<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>週間情報｜ゆ馬場</title><style>*{box-sizing:border-box}body{margin:0;background:#f7faf7;color:#242424;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif}main{max-width:850px;margin:0 auto;padding:22px 16px 65px}a{color:#378653}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}h1{font-size:26px;margin:0 0 6px}.muted{color:#718176;font-size:13px;line-height:1.6}.tabs{display:flex;gap:10px;margin:24px 0 14px}.tabs button{font:inherit;font-size:17px;font-weight:700;border:1px solid #cbdcce;border-radius:9px;background:white;padding:11px 28px;cursor:pointer}.tabs button.active{background:#51a66e;color:white;border-color:#51a66e}.card{background:white;border:1px solid #e0e9e1;border-radius:15px;padding:20px;margin:14px 0;overflow:hidden}h2{font-size:18px;margin:0 0 12px}.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:660px;font-size:13px}th,td{padding:10px 11px;border:1px solid #e1e8e2;text-align:center;white-space:nowrap}th:first-child,td:first-child{position:sticky;left:0;background:#f4f8f5;text-align:left;font-weight:700}th{background:#eef5ef}.status{padding:25px 10px;color:#6b7e70;text-align:center;line-height:1.8}.notes{list-style:none;margin:0;padding:0;text-align:left}#notes:not(.status){text-align:left}.weatherIcons{display:inline-flex;align-items:center;justify-content:center;gap:4px;vertical-align:middle}.weatherIcons svg{width:23px;height:23px;display:block;stroke-linecap:round;stroke-linejoin:round}.weatherCell{min-width:62px}.notes li{padding:12px 0;border-bottom:1px solid #e9eee9;line-height:1.6;font-size:14px}.notes li:last-child{border:0}.source{display:inline-block;margin-top:12px;font-size:13px}#stamp{font-size:12px;color:#87948b}</style></head><body><main><header><a href="./index.html">← 馬場分析に戻る</a><span class="muted">ゆ馬場</span></header><h1>週間情報</h1><p class="muted">JRAが公開する天候・雨量・散水・馬場管理情報。取得元の公開状況により、表示されない場合があります。</p><div class="tabs"><button data-track="東京" class="active">東京</button><button data-track="京都">京都</button></div><div class="card"><h2 id="heading">東京競馬場</h2><div id="stamp"></div><div class="scroll" id="table"><div class="status">情報を取得しています…</div></div><a id="source" class="source" href="https://www.jra.go.jp/keiba/baba/" target="_blank" rel="noopener">JRA公式ページで確認 ↗</a></div><div class="card"><h2>馬場管理の記録</h2><div id="notes" class="status">取得中…</div></div><p class="muted">データ出典：JRA「馬場情報」。このページは非公式の表示ツールです。更新されない場合はJRA公式ページを確認してください。</p></main><script>
const API='https://keiba-track-data.sleeping4439.workers.dev/weekly';let data=null;let current=new URLSearchParams(location.search).get('track');if(!['東京','京都'].includes(current))current='東京';const $=id=>document.getElementById(id);
function weatherDisplay(raw){
 const v=String(raw||'').trim();if(!v)return null;
 const normalized=v.replace(/\s+/g,'');
 const half=normalized.length/2;
 const value=Number.isInteger(half)&&normalized.slice(0,half)===normalized.slice(half)?normalized.slice(0,half):normalized;
 const tokens=[...value.matchAll(/晴|曇|雨|雪/g)].map(m=>m[0]);
 return tokens.length?{label:value,tokens}:null;
}
const iconPaths={
 晴:'<circle cx="12" cy="12" r="4.2" fill="currentColor" stroke="none"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.5 1.5m10.4 10.4 1.5 1.5M18.7 5.3l-1.5 1.5M6.8 17.2l-1.5 1.5"/>',
 曇:'<path d="M6.6 18.5h11a4 4 0 0 0 .3-8 6.3 6.3 0 0 0-12.1 1.6A3.5 3.5 0 0 0 6.6 18.5Z" fill="currentColor" fill-opacity=".16"/> <path d="M6.6 18.5h11a4 4 0 0 0 .3-8 6.3 6.3 0 0 0-12.1 1.6A3.5 3.5 0 0 0 6.6 18.5Z"/>',
 雨:'<path d="M3 12a9 9 0 0 1 18 0H3Z" fill="currentColor" fill-opacity=".18"/><path d="M3 12a9 9 0 0 1 18 0M12 3v16a3 3 0 0 0 6 0"/>',
 雪:'<path d="M12 2.5v19M3.8 7.25l16.4 9.5M3.8 16.75l16.4-9.5M9.5 5l2.5 2.5L14.5 5M9.5 19l2.5-2.5 2.5 2.5"/>'
};
const iconColors={晴:'#e7a13a',曇:'#8e9b9b',雨:'#69b8d8',雪:'#86b6d4'};
function makeWeatherIcon(token){
 const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
 svg.setAttribute('viewBox','0 0 24 24');svg.setAttribute('fill','none');svg.setAttribute('stroke','currentColor');svg.setAttribute('stroke-width','1.9');svg.setAttribute('aria-hidden','true');svg.style.color=iconColors[token];
 svg.innerHTML=iconPaths[token];return svg;
}
function render(){document.querySelectorAll('[data-track]').forEach(b=>b.classList.toggle('active',b.dataset.track===current));$('heading').textContent=current+'競馬場';const x=data?.tracks?.[current];$('source').href=x?.sourceUrl||'https://www.jra.go.jp/keiba/baba/';$('stamp').textContent=x?.heading||'';if(!x?.available||!Array.isArray(x.rows)||!x.rows.length){$('table').innerHTML='<div class="status">週間情報を取得できませんでした。<br>JRA公式ページから確認してください。</div>'; $('notes').textContent='管理記録を取得できませんでした。';return}const table=document.createElement('table');const tbody=document.createElement('tbody');x.rows.forEach((row,i)=>{const tr=document.createElement('tr');row.forEach(v=>{const c=document.createElement(i===0?'th':'td');if(i===1&&row[0]==='天候'&&v){const w=weatherDisplay(v);if(w){c.classList.add('weatherCell');const span=document.createElement('span');span.className='weatherIcons';span.title=w.label;span.setAttribute('role','img');span.setAttribute('aria-label',w.label);w.tokens.forEach(token=>span.appendChild(makeWeatherIcon(token)));c.appendChild(span)}else c.textContent=v}else c.textContent=v;tr.appendChild(c)});tbody.appendChild(tr)});table.appendChild(tbody);$('table').replaceChildren(table);$('notes').classList.remove('status');const notes=document.createElement('ul');notes.className='notes';(x.updates||[]).forEach(u=>{const li=document.createElement('li');li.textContent=u.date+'｜'+u.course+'：'+u.text;notes.appendChild(li)});$('notes').replaceChildren(notes.childElementCount?notes:document.createTextNode('掲載された管理記録はありません。'))}document.querySelectorAll('[data-track]').forEach(b=>b.addEventListener('click',()=>{current=b.dataset.track;render()}));document.querySelector('[data-track="'+current+'"]').classList.add('active');fetch(API,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('unavailable');return r.json()}).then(d=>{data=d;render()}).catch(()=>{data=null;render()});</script></body></html>
