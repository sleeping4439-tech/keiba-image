<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>レース一覧・出馬表｜馬場分析</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;color:#20352a;background:#f5f8f4}*{box-sizing:border-box}body{margin:0}main{max-width:820px;margin:auto;padding:24px 16px 70px}a{color:#217044;text-decoration:none}header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:22px}h1{font-size:24px;margin:0 0 6px}p{line-height:1.65}.muted{color:#718176;font-size:13px}.panel{background:#fff;border:1px solid #dce8df;border-radius:15px;padding:20px;margin:18px 0;box-shadow:0 2px 12px #183b2110}h2{font-size:17px;margin:0 0 14px}button{font:inherit;cursor:pointer;border:1px solid #cdded2;border-radius:9px;background:#fff;padding:10px 14px;color:#214d34}button.active{background:#247448;color:#fff;border-color:#247448}.tabs{display:flex;gap:8px;flex-wrap:wrap}.empty{border:1px dashed #c5d8ca;border-radius:12px;background:#f8faf8;padding:24px;text-align:center;color:#647b6c}.row{padding:12px 0;border-bottom:1px solid #e6eee8}.row:last-child{border:0}.row button{width:100%;text-align:left}.entry-line{padding:10px 4px;border-bottom:1px solid #e6eee8}.entry-line:last-child{border:0}.entry-no{display:inline-block;min-width:3em;font-weight:700}.entry-tools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.entry-tools input{flex:1;min-width:190px;border:1px solid #cdded2;border-radius:9px;padding:10px;font:inherit}.entry-tools button{white-space:nowrap}.horse-table{width:100%;border-collapse:collapse;font-size:13px}.horse-table th,.horse-table td{padding:10px 6px;border-bottom:1px solid #e3eae4;text-align:left}#detail[hidden],#raceList[hidden]{display:none}.back{margin-bottom:16px} .note{font-size:13px;color:#647b6c}.compare-check{margin-right:10px;accent-color:#247448;width:17px;height:17px}.compare-panel{margin-top:18px;padding:15px;border:1px solid #cbded1;border-radius:12px;background:#f8fcf9}.compare-panel[hidden]{display:none}.compare-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.compare-legend{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.compare-tag{font-size:12px;padding:5px 9px;border:1px solid #d6e5db;border-radius:8px;background:#fff}.compare-svg{display:block;width:100%;max-width:440px;margin:auto}.compare-status{font-size:12px;color:#6a8072}.entry-line{display:flex;align-items:center;gap:8px}.entry-line>a{flex:1}</style></head><body><main><header><a href="./index.html">← 馬場分析に戻る</a><span class="muted">JRAレース情報</span></header><h1>レース一覧</h1><p class="muted">JRAの競馬番組から東京・京都のレース情報を取得します。レースを選ぶと出走馬を表示します。公式出馬表URLが必要な場合は入力できます。</p><section class="panel" id="raceList"><h2 id="weekLabel">開催週</h2><div class="entry-tools"><button id="prevWeek" type="button">← 前週</button><button id="currentWeek" type="button">今週</button><button id="nextWeek" type="button">翌週 →</button><button id="refreshRaces" type="button">更新 ↻</button></div><div class="tabs" id="days"></div><div id="auditResult" class="muted" aria-live="polite"></div><div id="races" style="margin-top:18px"></div></section><section class="panel" id="detail" hidden><button class="back" id="back">← レース一覧に戻る</button><h2 id="raceTitle">出馬表</h2><p class="muted">比較したい馬にチェック（最大4頭）。ゆ馬録に保存した能力評価を重ねて表示します。</p><div id="entries"></div><div id="comparePanel" class="compare-panel" hidden><div class="compare-head"><strong id="compareTitle">能力比較</strong><button id="clearCompare" type="button">選択解除</button></div><div id="compareChart"></div><p class="compare-status" id="compareStatus"></p></div><div class="entry-tools"><input id="sourceInput" type="url" placeholder="JRA公式出馬表のURLを貼り付け"><button id="loadEntries">出走馬を取得</button></div><p class="muted" id="entryHint">公式出馬表URLを入力すると、この画面に出走馬を表示します。</p></section><p class="note">JRA競馬番組は予定情報です。出走馬はJRA公式出馬表から取得します。開催予定と正式な出馬表が異なる場合があります。</p></main><script>
const $=id=>document.getElementById(id);
const ROOT='https://keiba-track-data.sleeping4439.workers.dev';const API=ROOT+'/races';
const VERIFIED={'2026-10-10|京都|4':'pw01dde0108202604030420261010/49','2026-10-10|京都|1':'pw01dde0108202604030120261010/2A','2026-10-12|京都|4':'pw01dde0108202604050420261012/A9','2026-10-12|京都|6':'pw01dde0108202604050620261012/13','2026-10-12|京都|7':'pw01dde0108202604050720261012/C8','2026-10-10|東京|1':'pw01dde1005202604030120261010/2B','2026-10-10|東京|12':'pw01dde0105202604031220261010/53','2026-10-11|東京|12':'pw01dde0105202604041220261011/83','2026-10-12|京都|1':'pw01dde0108202604050120261012/8A','2026-10-12|京都|2':'pw01dde0108202604050220261012/3F','2026-10-12|京都|10':'pw01dde0108202604051020261012/27','2026-10-12|京都|12':'pw01dde0108202604051220261012/91','2026-10-12|東京|5':'pw01dde0105202604050520261012/80','2026-10-12|東京|12':'pw01dde0105202604051220261012/B3','2026-10-11|京都|1':'pw01dde0108202604040120261011/5A','2026-10-11|京都|2':'pw01dde0108202604040220261011/0F','2026-10-11|京都|3':'pw01dde0108202604040320261011/C4','2026-10-11|京都|5':'pw01dde0108202604040520261011/2E','2026-10-11|京都|6':'pw01dde0108202604040620261011/E3','2026-10-11|京都|7':'pw01dde0108202604040720261011/98','2026-10-11|京都|9':'pw01dde0108202604040920261011/02','2026-10-11|京都|12':'pw01dde0108202604041220261011/61','2026-10-10|京都|12':'pw01dde0108202604031220261010/31'};
let activeDate='',detailRequest=0;
function officialUrl(date,track,num){const code=VERIFIED[date+'|'+track+'|'+num];return code?'https://www.jra.go.jp/JRADB/accessD.html?CNAME='+encodeURIComponent(code):'';}
function makeHorseNameLink(name){const a=document.createElement('a');a.textContent=name;a.href='./yubaroku/?horseName='+encodeURIComponent(name);a.title='ゆ馬録で「'+name+'」を開く';a.style.cssText='font-weight:650;text-decoration:underline;text-decoration-color:#a2cdb4;text-underline-offset:3px';return a;}

const COMPARE_COLORS=['#d45b51','#287db7','#aa7b23','#7e56b4'];
const COMPARE_LABELS=['基礎スピード','最高速度','速度持続','運動持続','パワー'];
let compareNames=new Set();
function savedHorseProfiles(){try{const h=JSON.parse(localStorage.getItem('yubarokuHorsesV1')||'[]');return Array.isArray(h)?h:[]}catch{return []}}
function normalizeHorseName(s){return String(s||'').normalize('NFKC').trim()}
function findSavedProfile(name){return savedHorseProfiles().find(h=>normalizeHorseName(h.name)===normalizeHorseName(name)&&Array.isArray(h.values)&&h.values.length===5&&h.values.every(v=>Number.isInteger(v)&&v>=1&&v<=5))}
function chartPoint(level,index){const a=-Math.PI/2+index*2*Math.PI/5;return [210+Math.cos(a)*level*28,188+Math.sin(a)*level*28]}
function chartPolygon(values){return values.map((v,i)=>chartPoint(v,i).join(',')).join(' ')}
function makeSvg(tag,attrs={},textValue){const e=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,String(v));if(textValue!==undefined)e.textContent=textValue;return e}
function renderComparison(){
 const panel=$('comparePanel'),chart=$('compareChart'),status=$('compareStatus');
 panel.hidden=compareNames.size===0;if(panel.hidden)return;
 $('compareTitle').textContent='能力比較（'+compareNames.size+'/4頭）';
 chart.replaceChildren();const legend=document.createElement('div');legend.className='compare-legend';
 const selected=[...compareNames].map(name=>({name,profile:findSavedProfile(name)}));const found=selected.filter(x=>x.profile),missing=selected.filter(x=>!x.profile);
 for(const [i,item] of found.entries()){const tag=document.createElement('span');tag.className='compare-tag';tag.style.borderLeft='5px solid '+COMPARE_COLORS[i];tag.textContent=item.name;legend.appendChild(tag)}
 chart.appendChild(legend);
 if(found.length){
  const svg=makeSvg('svg',{viewBox:'0 0 420 390',role:'img','aria-label':found.map(x=>x.name+'の能力レーダーチャート').join('、')});svg.classList.add('compare-svg');
  for(let n=1;n<=5;n++)svg.appendChild(makeSvg('polygon',{points:chartPolygon([n,n,n,n,n]),fill:'none',stroke:'#bdd1c5','stroke-width':n===5?1.5:1}));
  for(let i=0;i<5;i++){const p=chartPoint(5,i);svg.appendChild(makeSvg('line',{x1:210,y1:188,x2:p[0],y2:p[1],stroke:'#c4d6ca'}));const q=chartPoint(6.25,i);svg.appendChild(makeSvg('text',{x:q[0],y:q[1],fill:'#476452','font-size':12,'text-anchor':'middle','dominant-baseline':'middle'},COMPARE_LABELS[i]))}
  for(const [i,item] of found.entries()){const color=COMPARE_COLORS[i];svg.appendChild(makeSvg('polygon',{points:chartPolygon(item.profile.values),fill:color,'fill-opacity':0.13,stroke:color,'stroke-width':2.6,'stroke-linejoin':'round'}));for(let j=0;j<5;j++){const p=chartPoint(item.profile.values[j],j);svg.appendChild(makeSvg('circle',{cx:p[0],cy:p[1],r:3.2,fill:color}))}}
  chart.appendChild(svg);
 }
 status.replaceChildren();if(missing.length){const p=document.createElement('p');p.textContent='ゆ馬録に未登録、またはこの端末に未読込：'+missing.map(x=>x.name).join('、');status.appendChild(p);const a=document.createElement('a');a.href='./yubaroku/?horseName='+encodeURIComponent(missing[0].name);a.textContent='ゆ馬録で確認する ↗';status.appendChild(a)}
 if(!found.length){const p=document.createElement('p');p.textContent='比較するには、ゆ馬録に馬を登録し、必要に応じてクラウドから読み込んでください。';status.appendChild(p)}
}
function resetComparison(){compareNames.clear();$('comparePanel').hidden=true}
function makeCompareCheck(name){const input=document.createElement('input');input.type='checkbox';input.className='compare-check';input.setAttribute('aria-label',name+'を能力比較');input.checked=compareNames.has(name);input.addEventListener('change',()=>{if(input.checked){if(compareNames.size>=4){input.checked=false;alert('比較できるのは最大4頭です');return}compareNames.add(name)}else compareNames.delete(name);renderComparison()});return input}
$('clearCompare').addEventListener('click',()=>{resetComparison();document.querySelectorAll('.compare-check').forEach(x=>x.checked=false)});
window.addEventListener('storage',e=>{if(e.key==='yubarokuHorsesV1')renderComparison()});
async function loadEntries(sourceUrl){const id=++detailRequest;const target=$('entries');target.innerHTML='<div class="empty">出走馬を取得中…</div>';let parsed;try{parsed=new URL(sourceUrl);if(parsed.protocol!=='https:'||!['www.jra.go.jp','jra.jp'].includes(parsed.hostname)||parsed.pathname!=='/JRADB/accessD.html'||!parsed.searchParams.get('CNAME'))throw Error('JRA公式出馬表のURLを入力してください');let data=null,lastError='出走馬を取得できませんでした';for(let attempt=0;attempt<3;attempt++){if(id!==detailRequest)return;try{const response=await fetch(ROOT+'/entries?sourceUrl='+encodeURIComponent(parsed.href)+'&_='+Date.now()+'-'+attempt,{cache:'no-store'});data=await response.json();if(response.ok&&data.available&&Array.isArray(data.entries)&&data.entries.length)break;lastError=data.error||'出走馬を取得できませんでした';}catch(err){lastError=err.message||String(err)}if(attempt<2){target.innerHTML='<div class="empty">JRAから再取得しています…（'+(attempt+2)+'/3）</div>';await new Promise(resolve=>setTimeout(resolve,700*(attempt+1)));}}if(id!==detailRequest)return;if(!data?.available||!Array.isArray(data.entries)||!data.entries.length)throw Error(lastError);target.replaceChildren();const summary=document.createElement('p');summary.className='muted';summary.textContent=data.entries.length+'頭の出走馬を取得・馬名を押すとゆ馬録で検索';target.appendChild(summary);for(const entry of data.entries){const row=document.createElement('div');row.className='entry-line';const n=document.createElement('span');n.className='entry-no';n.textContent=entry.number+'番';row.append(makeCompareCheck(entry.name),n,makeHorseNameLink(entry.name));target.appendChild(row)}$('entryHint').textContent='JRA公式出馬表から取得しました。';}catch(error){if(id!==detailRequest)return;target.replaceChildren();const e=document.createElement('div');e.className='empty';e.textContent=(error.message||'取得に失敗しました')+'。時間を置いて「出走馬を取得」を押すと再試行できます。';target.appendChild(e);}}
async function loadAutoEntries(date,track,number,manualFallback=''){
 const id=++detailRequest,target=$('entries');target.innerHTML='<div class="empty">JRA公式出馬表を照合・取得中…</div>';
 let error='出馬表を取得できませんでした';
 for(let attempt=0;attempt<2;attempt++){
  if(id!==detailRequest)return;
  try{
   const params=new URLSearchParams({date,track,number:String(number),_:String(Date.now())});
   const response=await fetch(ROOT+'/entries-by-race?'+params,{cache:'no-store'});
   const data=await response.json();
   if(id!==detailRequest)return;
   if(data.available&&Array.isArray(data.entries)&&data.entries.length&&data.date===date&&data.track===track&&data.number===number){
    target.replaceChildren();const summary=document.createElement('p');summary.className='muted';summary.textContent=data.entries.length+'頭の出走馬を取得（JRA公式・レース照合済み）・馬名からゆ馬録へ';target.appendChild(summary);
    for(const entry of data.entries){const row=document.createElement('div');row.className='entry-line';const n=document.createElement('span');n.className='entry-no';n.textContent=entry.number+'番';row.append(makeCompareCheck(entry.name),n,makeHorseNameLink(entry.name));target.appendChild(row)}
    $('sourceInput').value=data.sourceUrl||'';$('entryHint').textContent='開催日・競馬場・レース番号をJRA公式出馬表と照合しました。';return;
   }
   error=data.error||'出走馬を取得できませんでした';
  }catch(e){error=e.message||String(e)}
 }
 if(id!==detailRequest)return;
 if(manualFallback){loadEntries(manualFallback);return;}
 target.innerHTML='<div class="empty">出馬表を自動特定できませんでした（'+error+'）。下の欄から公式URLを指定することもできます。</div>';
}
function openRace(date,track,race){resetComparison();$('raceList').hidden=true;$('detail').hidden=false;$('raceTitle').textContent=track+' '+race.number+'R　'+race.name;$('entries').replaceChildren();const source=officialUrl(date,track,race.number);$('sourceInput').value=source;$('entryHint').textContent=source?'確認済みのJRA公式出馬表を使用します。':'JRA公式サイトの該当レースの出馬表URLを貼り付けてください。';loadAutoEntries(date,track,race.number,source);}
$('loadEntries').addEventListener('click',()=>loadEntries($('sourceInput').value.trim()));
// Japan-local calendar dates, independent of the viewer's device timezone.
const fmt=d=>(d.getMonth()+1)+'/'+d.getDate()+'（'+'日月火水木金土'[d.getDay()]+'）';
const iso=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
const japanToday=()=>{const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const get=k=>Number(parts.find(p=>p.type===k).value);return new Date(get('year'),get('month')-1,get('day'),12)};
function saturdayOf(d){const x=new Date(d);x.setDate(x.getDate()+(x.getDay()===0?-1:(6-x.getDay()+7)%7));return x}
let weekOffset=0,selectedDates=[],request=0;
const days=$('days');
function buildWeek(preserveDate=''){
 const saturday=saturdayOf(japanToday());saturday.setDate(saturday.getDate()+weekOffset*7);
 const sunday=new Date(saturday);sunday.setDate(sunday.getDate()+1);
 selectedDates=[saturday,sunday];$('weekLabel').textContent=fmt(saturday)+' 〜 '+fmt(sunday)+' 開催予定';
 days.replaceChildren();
 for(const d of selectedDates){const b=document.createElement('button');b.dataset.date=iso(d);b.textContent=fmt(d);b.addEventListener('click',()=>showDay(d));days.appendChild(b)}
 const today=iso(japanToday());const target=selectedDates.find(d=>iso(d)===preserveDate)||selectedDates.find(d=>iso(d)===today)||selectedDates[0];showDay(target);
 $('currentWeek').disabled=weekOffset===0;
}
$('prevWeek').addEventListener('click',()=>{weekOffset--;buildWeek()});
$('nextWeek').addEventListener('click',()=>{weekOffset++;buildWeek()});
$('currentWeek').addEventListener('click',()=>{weekOffset=0;buildWeek()});
$('refreshRaces').addEventListener('click',()=>{const d=selectedDates.find(x=>iso(x)===activeDate)||selectedDates[0];showDay(d)});
function showDay(d){activeDate=iso(d);const id=++request;days.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x.dataset.date===iso(d)));$('races').innerHTML='<div class="empty">JRAのレース情報を取得中…</div>';fetch(API+'?date='+iso(d)+'&_='+Date.now(),{cache:'no-store'}).then(async r=>{const body=await r.text();let data;try{data=JSON.parse(body)}catch{throw Error('APIの応答がJSONではありません (HTTP '+r.status+')')}if(!r.ok)throw Error('HTTP '+r.status+' '+(data.error||''));return data}).then(data=>{if(id!==request)return;const area=$('races');area.replaceChildren();if(!Array.isArray(data.races)||!data.races.length){const err=document.createElement('div');err.className='empty';err.textContent='レース情報を取得できませんでした。API応答: '+JSON.stringify({available:data.available,error:data.error,notice:data.notice,sourceUrl:data.sourceUrl});area.appendChild(err);return}const status=document.createElement('p');status.className='muted';status.textContent='出走馬はJRA公式の出馬表公開後に取得できます。馬名がまだ表示されない場合は、公開後に再度開いてください。';area.appendChild(status);for(const track of [...new Set(data.races.map(x=>x.track).filter(Boolean))]){const h=document.createElement('h2');h.textContent=track+'競馬場';h.style.marginTop='20px';area.appendChild(h);const list=data.races.filter(x=>x.track===track).sort((a,b)=>a.number-b.number);if(!list.length){const p=document.createElement('p');p.className='muted';p.textContent='取得できたレースはありません。';area.appendChild(p)}for(const race of list){const row=document.createElement('div');row.className='row';const title=document.createElement('button');title.textContent=race.number+'R　'+race.name+'　›';title.addEventListener('click',()=>openRace(iso(d),track,race));row.appendChild(title);const info=document.createElement('div');info.className='muted';info.style.marginTop='5px';info.textContent=[race.time,race.surface,race.distance?race.distance+'m':''].filter(Boolean).join(' ・ ');row.appendChild(info);area.appendChild(row)}}if(data.races.some(x=>!x.track)){const note=document.createElement('p');note.className='muted';note.textContent='※ 競馬場名を判別できないレースは表示対象外です。';area.appendChild(note)}const a=document.createElement('a');a.href=data.sourceUrl;a.target='_blank';a.rel='noopener';a.textContent='JRA公式の競馬番組を確認 ↗';a.style.display='inline-block';a.style.marginTop='18px';area.appendChild(a)}).catch(err=>{if(id===request){const area=$('races');area.replaceChildren();const box=document.createElement('div');box.className='empty';box.textContent='取得エラー: '+(err.message||String(err))+'。通信制限や一時的な接続障害の可能性があります。';area.appendChild(box);}})}
buildWeek();
$('back').addEventListener('click',()=>{$('detail').hidden=true;$('raceList').hidden=false});
</script></body></html>
