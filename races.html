<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>レース一覧・出馬表｜馬場分析</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;color:#20352a;background:#f5f8f4}*{box-sizing:border-box}body{margin:0}main{max-width:820px;margin:auto;padding:24px 16px 70px}a{color:#217044;text-decoration:none}header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:22px}h1{font-size:24px;margin:0 0 6px}p{line-height:1.65}.muted{color:#718176;font-size:13px}.panel{background:#fff;border:1px solid #dce8df;border-radius:15px;padding:20px;margin:18px 0;box-shadow:0 2px 12px #183b2110}h2{font-size:17px;margin:0 0 14px}button{font:inherit;cursor:pointer;border:1px solid #cdded2;border-radius:9px;background:#fff;padding:10px 14px;color:#214d34}button.active{background:#247448;color:#fff;border-color:#247448}.tabs{display:flex;gap:8px;flex-wrap:wrap}.empty{border:1px dashed #c5d8ca;border-radius:12px;background:#f8faf8;padding:24px;text-align:center;color:#647b6c}.row{padding:12px 0;border-bottom:1px solid #e6eee8}.row:last-child{border:0}.row button{width:100%;text-align:left}.entry-line{padding:10px 4px;border-bottom:1px solid #e6eee8}.entry-line:last-child{border:0}.entry-no{display:inline-block;min-width:3em;font-weight:700}.entry-tools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.entry-tools input{flex:1;min-width:190px;border:1px solid #cdded2;border-radius:9px;padding:10px;font:inherit}.entry-tools button{white-space:nowrap}.horse-table{width:100%;border-collapse:collapse;font-size:13px}.horse-table th,.horse-table td{padding:10px 6px;border-bottom:1px solid #e3eae4;text-align:left}#detail[hidden],#raceList[hidden]{display:none}.back{margin-bottom:16px}.note{font-size:13px;color:#647b6c}</style></head><body><main><header><a href="./index.html">← 馬場分析に戻る</a><span class="muted">JRAレース情報</span></header><h1>レース一覧</h1><p class="muted">JRAの競馬番組から東京・京都のレース情報を取得します。レースを選ぶと出走馬を表示します。公式出馬表URLが必要な場合は入力できます。</p><section class="panel" id="raceList"><h2 id="weekLabel">開催週</h2><div class="tabs" id="days"></div><div id="races" style="margin-top:18px"></div></section><section class="panel" id="detail" hidden><button class="back" id="back">← レース一覧に戻る</button><h2 id="raceTitle">出馬表</h2><div id="entries"></div><div class="entry-tools"><input id="sourceInput" type="url" placeholder="JRA公式出馬表のURLを貼り付け"><button id="loadEntries">出走馬を取得</button></div><p class="muted" id="entryHint">公式出馬表URLを入力すると、この画面に出走馬を表示します。</p></section><p class="note">JRA競馬番組は予定情報です。出走馬はJRA公式出馬表から取得します。開催予定と正式な出馬表が異なる場合があります。</p></main><script>
const $=id=>document.getElementById(id);
const ROOT='https://keiba-track-data.sleeping4439.workers.dev';const API=ROOT+'/races';
const VERIFIED={'2026-10-11|京都|1':'pw01dde0108202604040120261011/5A','2026-10-11|京都|2':'pw01dde0108202604040220261011/0F','2026-10-11|京都|3':'pw01dde0108202604040320261011/C4','2026-10-11|京都|5':'pw01dde0108202604040520261011/2E','2026-10-11|京都|6':'pw01dde0108202604040620261011/E3','2026-10-11|京都|7':'pw01dde0108202604040720261011/98','2026-10-11|京都|9':'pw01dde0108202604040920261011/02','2026-10-11|京都|12':'pw01dde0108202604041220261011/61','2026-10-10|京都|12':'pw01dde0108202604031220261010/31'};
let activeDate='',detailRequest=0;
function officialUrl(date,track,num){const code=VERIFIED[date+'|'+track+'|'+num];return code?'https://www.jra.go.jp/JRADB/accessD.html?CNAME='+encodeURIComponent(code):'';}
async function loadEntries(sourceUrl){const id=++detailRequest;const target=$('entries');target.innerHTML='<div class="empty">出走馬を取得中…</div>';let parsed;try{parsed=new URL(sourceUrl);if(parsed.protocol!=='https:'||!['www.jra.go.jp','jra.jp'].includes(parsed.hostname)||parsed.pathname!=='/JRADB/accessD.html'||!parsed.searchParams.get('CNAME'))throw Error('JRA公式出馬表のURLを入力してください');const response=await fetch(ROOT+'/entries?sourceUrl='+encodeURIComponent(parsed.href),{cache:'no-store'});const data=await response.json();if(id!==detailRequest)return;if(!response.ok||!data.available||!Array.isArray(data.entries)||!data.entries.length)throw Error(data.error||'出走馬を取得できませんでした');target.replaceChildren();const summary=document.createElement('p');summary.className='muted';summary.textContent=data.entries.length+'頭の出走馬を取得';target.appendChild(summary);for(const entry of data.entries){const row=document.createElement('div');row.className='entry-line';const n=document.createElement('span');n.className='entry-no';n.textContent=entry.number+'番';const name=document.createElement('span');name.textContent=entry.name;row.append(n,name);target.appendChild(row)}$('entryHint').textContent='JRA公式出馬表から取得しました。';}catch(error){if(id!==detailRequest)return;target.replaceChildren();const e=document.createElement('div');e.className='empty';e.textContent=error.message||'取得に失敗しました';target.appendChild(e);}}
function openRace(date,track,race){$('raceList').hidden=true;$('detail').hidden=false;$('raceTitle').textContent=track+' '+race.number+'R　'+race.name;$('entries').replaceChildren();const source=officialUrl(date,track,race.number);$('sourceInput').value=source;$('entryHint').textContent=source?'確認済みのJRA公式出馬表を使用します。':'JRA公式サイトの該当レースの出馬表URLを貼り付けてください。';if(source)loadEntries(source);else $('entries').innerHTML='<div class="empty">このレースの出馬表URLはまだ自動取得できません。下にJRA公式の出馬表URLを貼り付けてください。</div>';}
$('loadEntries').addEventListener('click',()=>loadEntries($('sourceInput').value.trim()));
const today=new Date();const day=today.getDay();const saturday=new Date(today);saturday.setDate(today.getDate()+((6-day+7)%7));const sunday=new Date(saturday);sunday.setDate(saturday.getDate()+1);
const fmt=d=>(d.getMonth()+1)+'/'+d.getDate()+'（'+'日月火水木金土'[d.getDay()]+'）';
const iso=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
$('weekLabel').textContent='次の土日：'+fmt(saturday)+'・'+fmt(sunday);
const days=$('days');let request=0;
function showDay(d){activeDate=iso(d);const id=++request;days.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x.dataset.date===iso(d)));$('races').innerHTML='<div class="empty">JRAのレース情報を取得中…</div>';fetch(API+'?date='+iso(d)+'&_='+Date.now(),{cache:'no-store'}).then(async r=>{const body=await r.text();let data;try{data=JSON.parse(body)}catch{throw Error('APIの応答がJSONではありません (HTTP '+r.status+')')}if(!r.ok)throw Error('HTTP '+r.status+' '+(data.error||''));return data}).then(data=>{if(id!==request)return;const area=$('races');area.replaceChildren();if(!Array.isArray(data.races)||!data.races.length){const err=document.createElement('div');err.className='empty';err.textContent='レース情報を取得できませんでした。API応答: '+JSON.stringify({available:data.available,error:data.error,notice:data.notice,sourceUrl:data.sourceUrl});area.appendChild(err);return}for(const track of ['東京','京都']){const h=document.createElement('h2');h.textContent=track+'競馬場';h.style.marginTop='20px';area.appendChild(h);const list=data.races.filter(x=>x.track===track).sort((a,b)=>a.number-b.number);if(!list.length){const p=document.createElement('p');p.className='muted';p.textContent='取得できたレースはありません。';area.appendChild(p)}for(const race of list){const row=document.createElement('div');row.className='row';const title=document.createElement('button');title.textContent=race.number+'R　'+race.name+'　›';title.addEventListener('click',()=>openRace(iso(d),track,race));row.appendChild(title);const info=document.createElement('div');info.className='muted';info.style.marginTop='5px';info.textContent=[race.time,race.surface,race.distance?race.distance+'m':''].filter(Boolean).join(' ・ ');row.appendChild(info);area.appendChild(row)}}const a=document.createElement('a');a.href=data.sourceUrl;a.target='_blank';a.rel='noopener';a.textContent='JRA公式の競馬番組を確認 ↗';a.style.display='inline-block';a.style.marginTop='18px';area.appendChild(a)}).catch(err=>{if(id===request){const area=$('races');area.replaceChildren();const box=document.createElement('div');box.className='empty';box.textContent='取得エラー: '+(err.message||String(err))+'。通信制限や一時的な接続障害の可能性があります。';area.appendChild(box);}})}
for(const d of [saturday,sunday]){const b=document.createElement('button');b.dataset.date=iso(d);b.textContent=fmt(d);b.addEventListener('click',()=>showDay(d));days.appendChild(b)}showDay(saturday);
$('back').addEventListener('click',()=>{$('detail').hidden=true;$('raceList').hidden=false});
</script></body></html>
