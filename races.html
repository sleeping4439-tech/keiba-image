<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>レース一覧・出馬表｜馬場分析</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;color:#20352a;background:#f5f8f4}*{box-sizing:border-box}body{margin:0}main{max-width:820px;margin:auto;padding:24px 16px 70px}a{color:#217044;text-decoration:none}header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:22px}h1{font-size:24px;margin:0 0 6px}p{line-height:1.65}.muted{color:#718176;font-size:13px}.panel{background:#fff;border:1px solid #dce8df;border-radius:15px;padding:20px;margin:18px 0;box-shadow:0 2px 12px #183b2110}h2{font-size:17px;margin:0 0 14px}button{font:inherit;cursor:pointer;border:1px solid #cdded2;border-radius:9px;background:#fff;padding:10px 14px;color:#214d34}button.active{background:#247448;color:#fff;border-color:#247448}.tabs{display:flex;gap:8px;flex-wrap:wrap}.empty{border:1px dashed #c5d8ca;border-radius:12px;background:#f8faf8;padding:24px;text-align:center;color:#647b6c}.row{padding:12px 0;border-bottom:1px solid #e6eee8}.row:last-child{border:0}.row button{width:100%;text-align:left}.horse-table{width:100%;border-collapse:collapse;font-size:13px}.horse-table th,.horse-table td{padding:10px 6px;border-bottom:1px solid #e3eae4;text-align:left}#detail[hidden],#raceList[hidden]{display:none}.back{margin-bottom:16px}.note{font-size:13px;color:#647b6c}</style></head><body><main><header><a href="./index.html">← 馬場分析に戻る</a><span class="muted">レース予想・準備ページ</span></header><h1>レース一覧</h1><p class="muted">開催週のレースを選んで出馬表を確認するためのページです。</p><section class="panel" id="raceList"><h2 id="weekLabel">開催週</h2><div class="tabs" id="days"></div><div id="races" style="margin-top:18px"></div></section><section class="panel" id="detail" hidden><button class="back" id="back">← レース一覧に戻る</button><h2 id="raceTitle">出馬表</h2><div id="entries"></div></section><p class="note">現在は画面構成のみ公開中です。レース・出走馬の実データは未接続のため、架空のデータは表示しません。今後、信頼できる取得元を接続します。</p></main><script>
const today=new Date();const day=today.getDay();const saturday=new Date(today);saturday.setDate(today.getDate()+((6-day+7)%7));const sunday=new Date(saturday);sunday.setDate(saturday.getDate()+1);const fmt=d=>(d.getMonth()+1)+'/'+d.getDate()+'（'+'日月火水木金土'[d.getDay()]+'）';document.getElementById('weekLabel').textContent='次の土日：'+fmt(saturday)+'・'+fmt(sunday);const days=document.getElementById('days');for(const d of [saturday,sunday]){const b=document.createElement('button');b.textContent=fmt(d);b.addEventListener('click',()=>{days.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('races').innerHTML='<div class="empty">レース情報はまだ接続されていません。<br>出馬表の公開後に取得できるよう、今後対応します。</div>';document.getElementById('detail').hidden=true;document.getElementById('raceList').hidden=false});days.appendChild(b)}days.firstChild.click();document.getElementById('back').addEventListener('click',()=>{document.getElementById('detail').hidden=true;document.getElementById('raceList').hidden=false});
</script></body></html>
