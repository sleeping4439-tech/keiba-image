<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>レース一覧・出馬表｜馬場分析</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;color:#20352a;background:#f5f8f4}*{box-sizing:border-box}body{margin:0}main{max-width:820px;margin:auto;padding:24px 16px 70px}a{color:#217044;text-decoration:none}header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:22px}h1{font-size:24px;margin:0 0 6px}p{line-height:1.65}.muted{color:#718176;font-size:13px}.panel{background:#fff;border:1px solid #dce8df;border-radius:15px;padding:20px;margin:18px 0;box-shadow:0 2px 12px #183b2110}h2{font-size:17px;margin:0 0 14px}button{font:inherit;cursor:pointer;border:1px solid #cdded2;border-radius:9px;background:#fff;padding:10px 14px;color:#214d34}button.active{background:#247448;color:#fff;border-color:#247448}.tabs{display:flex;gap:8px;flex-wrap:wrap}.empty{border:1px dashed #c5d8ca;border-radius:12px;background:#f8faf8;padding:24px;text-align:center;color:#647b6c}.row{padding:12px 0;border-bottom:1px solid #e6eee8}.row:last-child{border:0}.row button{width:100%;text-align:left}.horse-table{width:100%;border-collapse:collapse;font-size:13px}.horse-table th,.horse-table td{padding:10px 6px;border-bottom:1px solid #e3eae4;text-align:left}#detail[hidden],#raceList[hidden]{display:none}.back{margin-bottom:16px}.note{font-size:13px;color:#647b6c}</style></head><body><main><header><a href="./index.html">← 馬場分析に戻る</a><span class="muted">JRAレース情報</span></header><h1>レース一覧</h1><p class="muted">JRAの競馬番組から東京・京都のレース情報を取得します。出馬表は公式サイトで確認できます。</p><section class="panel" id="raceList"><h2 id="weekLabel">開催週</h2><div class="tabs" id="days"></div><div id="races" style="margin-top:18px"></div></section><section class="panel" id="detail" hidden><button class="back" id="back">← レース一覧に戻る</button><h2 id="raceTitle">出馬表</h2><div id="entries"></div></section><p class="note">JRA競馬番組は予定情報です。出走馬・騎手・枠順などの正式な出馬表はJRA公式サイトで確認してください。</p></main><script>
const API='https://keiba-track-data.sleeping4439.workers.dev/races';
const $=id=>document.getElementById(id);
const today=new Date();const day=today.getDay();const saturday=new Date(today);saturday.setDate(today.getDate()+((6-day+7)%7));const sunday=new Date(saturday);sunday.setDate(saturday.getDate()+1);
const fmt=d=>(d.getMonth()+1)+'/'+d.getDate()+'（'+'日月火水木金土'[d.getDay()]+'）';
const iso=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
$('weekLabel').textContent='次の土日：'+fmt(saturday)+'・'+fmt(sunday);
const days=$('days');let request=0;
function showDay(d){const id=++request;days.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x.dataset.date===iso(d)));$('races').innerHTML='<div class="empty">JRAのレース情報を取得中…</div>';fetch(API+'?date='+iso(d),{cache:'no-store'}).then(r=>r.json()).then(data=>{if(id!==request)return;const area=$('races');area.replaceChildren();if(!data.available||!data.races?.length){area.innerHTML='<div class="empty">レース情報を取得できませんでした。<br>Cloudflare Workerの再デプロイ後に再読み込みしてください。</div>';return}for(const track of ['東京','京都']){const h=document.createElement('h2');h.textContent=track+'競馬場';h.style.marginTop='20px';area.appendChild(h);const list=data.races.filter(x=>x.track===track).sort((a,b)=>a.number-b.number);if(!list.length){const p=document.createElement('p');p.className='muted';p.textContent='取得できたレースはありません。';area.appendChild(p)}for(const race of list){const row=document.createElement('div');row.className='row';const title=document.createElement('strong');title.textContent=race.number+'R　'+race.name;row.appendChild(title);const info=document.createElement('div');info.className='muted';info.style.marginTop='5px';info.textContent=[race.time,race.surface,race.distance?race.distance+'m':''].filter(Boolean).join(' ・ ');row.appendChild(info);area.appendChild(row)}}const a=document.createElement('a');a.href=data.sourceUrl;a.target='_blank';a.rel='noopener';a.textContent='JRA公式の競馬番組を確認 ↗';a.style.display='inline-block';a.style.marginTop='18px';area.appendChild(a)}).catch(()=>{if(id===request)$('races').innerHTML='<div class="empty">データを取得できませんでした。</div>'})}
for(const d of [saturday,sunday]){const b=document.createElement('button');b.dataset.date=iso(d);b.textContent=fmt(d);b.addEventListener('click',()=>showDay(d));days.appendChild(b)}showDay(saturday);
$('back').addEventListener('click',()=>{$('detail').hidden=true;$('raceList').hidden=false});
</script></body></html>
