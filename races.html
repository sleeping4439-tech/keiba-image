<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>レース一覧・出馬表｜馬場分析</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;color:#20352a;background:#f5f8f4}*{box-sizing:border-box}body{margin:0}main{max-width:820px;margin:auto;padding:24px 16px 70px}a{color:#217044;text-decoration:none}header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:22px}h1{font-size:24px;margin:0 0 6px}p{line-height:1.65}.muted{color:#718176;font-size:13px}.panel{background:#fff;border:1px solid #dce8df;border-radius:15px;padding:20px;margin:18px 0;box-shadow:0 2px 12px #183b2110}h2{font-size:17px;margin:0 0 14px}button{font:inherit;cursor:pointer;border:1px solid #cdded2;border-radius:9px;background:#fff;padding:10px 14px;color:#214d34}button.active{background:#247448;color:#fff;border-color:#247448}.tabs{display:flex;gap:8px;flex-wrap:wrap}.empty{border:1px dashed #c5d8ca;border-radius:12px;background:#f8faf8;padding:24px;text-align:center;color:#647b6c}.row{padding:12px 0;border-bottom:1px solid #e6eee8}.row:last-child{border:0}.row button{width:100%;text-align:left}.entry-line{padding:10px 4px;border-bottom:1px solid #e6eee8}.entry-line:last-child{border:0}.entry-no{display:inline-block;min-width:3em;font-weight:700}.entry-tools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.entry-tools input{flex:1;min-width:190px;border:1px solid #cdded2;border-radius:9px;padding:10px;font:inherit}.entry-tools button{white-space:nowrap}.horse-table{width:100%;border-collapse:collapse;font-size:13px}.horse-table th,.horse-table td{padding:10px 6px;border-bottom:1px solid #e3eae4;text-align:left}#detail[hidden],#raceList[hidden]{display:none}.back{margin-bottom:16px} .note{font-size:13px;color:#647b6c}.compare-check{margin-right:10px;accent-color:#247448;width:17px;height:17px}.compare-panel{margin-top:18px;padding:15px;border:1px solid #cbded1;border-radius:12px;background:#f8fcf9}.compare-panel[hidden]{display:none}.compare-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.compare-legend{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.compare-tag{font-size:12px;padding:5px 9px;border:1px solid #d6e5db;border-radius:8px;background:#fff}.compare-svg{display:block;width:100%;max-width:440px;margin:auto}.compare-status{font-size:12px;color:#6a8072}.entry-line{display:flex;align-items:center;gap:8px}.entry-line>a{flex:1}.week-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.week-heading h2{margin:0}.entry-tools.week-nav{justify-content:flex-end;margin:0;gap:8px;flex-wrap:nowrap}.entry-tools.week-nav button{padding:8px 12px;font-size:13px}.track-tabs{border-bottom:1px solid #dce8df;padding:4px 0 10px;margin-top:10px}.track-tabs button{border:0;border-radius:8px;padding:9px 20px;background:transparent;color:#496a54;font-weight:650}.track-tabs button.active{background:transparent;color:#247448;border-radius:0;box-shadow:inset 0 -3px 0 #247448}.track-tabs button{border-radius:0;color:#20352a}.track-tabs{padding-bottom:0}.track-tabs button:hover:not(.active){background:#f2f8f3}.race-item{padding:0;border:0;border-bottom:1px solid #dce8df}.race-item button{display:block;width:100%;padding:15px 12px;border:0;border-radius:0;background:transparent;font-weight:600;font-size:15px}.race-item button:hover{background:#f2f8f3}.race-list-notice{margin:8px 0 12px}.track-tabs:empty{display:none}#days{display:inline-flex;gap:0;flex-wrap:nowrap;border:1px solid #cdded2;border-radius:11px;overflow:hidden;max-width:100%}#days button{border:0;border-right:1px solid #cdded2;border-radius:0;margin:0;padding:11px 18px;white-space:nowrap}#days button:last-child{border-right:0}#days button.active{border-color:transparent}@media(max-width:700px){.week-heading{flex-direction:column;align-items:stretch;gap:12px}.entry-tools.week-nav{justify-content:flex-start;flex-wrap:wrap}}@media(max-width:560px){.entry-tools.week-nav{gap:5px}.entry-tools.week-nav button{padding:8px 9px;font-size:12px}.race-item button{font-size:14px}} .race-heading{display:flex;align-items:center;gap:16px;text-align:left;min-width:0}.race-heading-number{flex:0 0 46px;font-size:22px;font-weight:750;white-space:nowrap}.race-heading-lines{display:flex;flex-direction:column;gap:3px;min-width:0}.race-heading-main{font-size:16px;font-weight:700;line-height:1.45}.race-heading-sub{font-size:12px;font-weight:500;line-height:1.5}.race-heading-arrow{margin-left:auto;font-size:20px;font-weight:500}.race-item button{padding-top:14px;padding-bottom:14px}#raceTitle .race-heading{margin-top:8px}#raceTitle .race-heading-number{font-size:24px}#raceTitle .race-heading-main{font-size:20px}#raceTitle .race-heading-sub{font-size:14px}.race-detail-track{font-size:14px;font-weight:500;color:#718176}@media(max-width:560px){.race-heading{gap:10px}.race-heading-number{flex-basis:42px;font-size:19px}.race-heading-main{font-size:14px}.race-heading-sub{font-size:11px}#raceTitle .race-heading-main{font-size:18px}}.compare-legend{display:flex;flex-direction:column;align-items:stretch;gap:10px}.compare-horse-row{display:flex;flex-direction:column;align-items:stretch;gap:7px;flex-wrap:nowrap;padding:9px 12px 10px;border:1px solid #d6e5db;border-left:5px solid var(--horse-color);border-radius:10px;background:#fff}.compare-horse-row .compare-tag{flex:none;min-width:0;overflow-wrap:anywhere;border:0;border-left:0!important;border-radius:0;background:transparent;padding:0;font-weight:700}.compare-traits{display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:0}.compare-trait{font-size:12px;font-weight:600;color:#1e5b48;background:#e4f4ed;border:1px solid #cce6d8;border-radius:16px;padding:3px 9px;line-height:1.5}.compare-trait.negative{color:#7a6151;background:#f5eee8;border-color:#e8d8ca}.compare-traits-empty{font-size:12px;color:#7d9186}@media(max-width:560px){.compare-horse-row{gap:6px}.compare-horse-row .compare-tag{flex-basis:auto}.compare-traits{padding-left:0}}.race-memo{margin:14px 0 18px}.race-memo label{display:block;font-size:14px;font-weight:700;margin-bottom:8px}.race-memo textarea{display:block;width:100%;min-height:100px;resize:vertical;border:1px solid #c9dfd0;border-radius:12px;padding:12px;font:inherit;line-height:1.6;color:#20352a;background:#fff}.race-memo textarea:focus{outline:2px solid #217044;outline-offset:1px}#memoStatus{display:block;text-align:right;font-size:12px;color:#718176;margin-top:4px}.favorite-panel{padding:14px;border:1px solid #d7e5db;border-radius:14px;margin:12px 0 18px;background:#fff}.favorite-heading{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:14px;margin-bottom:8px}.favorite-heading span{font-size:12px;color:#718176}.favorite-list{display:flex;flex-direction:column;gap:6px}.favorite-empty{font-size:13px;color:#718176;margin:4px 0}.favorite-row{display:flex;align-items:center;gap:6px}.favorite-open{flex:1;min-width:0;text-align:left;padding:10px 12px;border:1px solid #d7e5db;border-radius:10px;background:#f7faf7;color:#20352a;font:inherit;cursor:pointer}.favorite-open small{display:block;color:#718176;font-size:12px;margin-top:3px}.favorite-star{flex:0 0 42px;min-width:42px;min-height:42px;padding:6px;border:1px solid #d7e5db;border-radius:10px;background:#fff;color:#b17917;font-size:24px;cursor:pointer}.race-item .favorite-star{flex:0 0 44px;min-width:44px}.detail-favorite{margin:4px 0 10px;padding:8px 12px;border:1px solid #d7e5db;border-radius:10px;background:#fff;color:#956516;font:inherit;font-size:14px;font-weight:600}</style></head><body><main><header><a href="./index.html">← 馬場分析に戻る</a><span class="muted">JRAレース情報</span></header><h1>レース一覧</h1><p class="muted">JRAの競馬番組から開催中の競馬場のレース情報を取得します。レースを選ぶと出走馬を表示します。公式出馬表URLが必要な場合は入力できます。</p><section class="panel" id="raceList"><div class="week-heading"><h2 id="weekLabel">開催週</h2><div class="entry-tools week-nav"><button id="prevWeek" type="button">← 前週</button><button id="currentWeek" type="button">今週</button><button id="nextWeek" type="button">翌週 →</button><button id="refreshRaces" type="button">更新 ↻</button></div></div><div class="favorite-panel"><div class="favorite-heading"><strong>★ お気に入りレース（10/17・18限定）</strong><span id="favoriteCount">0件</span></div><div id="favoriteList" class="favorite-list"></div></div><div class="tabs" id="days"></div><div id="auditResult" class="muted" aria-live="polite"></div><div class="tabs track-tabs" id="tracks" role="group" aria-label="競馬場を選択"></div><div id="races" style="margin-top:12px"></div></section><section class="panel" id="detail" hidden><button class="back" id="back">← レース一覧に戻る</button><h2 id="raceTitle">出馬表</h2><button id="detailFavorite" class="detail-favorite" type="button" hidden>☆ お気に入りに追加</button><div class="race-memo"><label for="raceMemo">レースメモ</label><textarea id="raceMemo" rows="3" placeholder="このレースについてメモを入力"></textarea><span id="memoStatus" aria-live="polite"></span></div><div id="entries"></div><div id="comparePanel" class="compare-panel" hidden><div class="compare-head"><strong id="compareTitle">能力比較</strong><button id="clearCompare" type="button">選択解除</button></div><div id="compareChart"></div><p class="compare-status" id="compareStatus"></p></div><div class="entry-tools"><input id="sourceInput" type="url" placeholder="JRA公式出馬表のURLを貼り付け"><button id="loadEntries">出走馬を取得</button></div><p class="muted" id="entryHint">公式出馬表URLを入力すると、この画面に出走馬を表示します。</p></section><p class="note">JRA競馬番組は予定情報です。出走馬はJRA公式出馬表から取得します。開催予定と正式な出馬表が異なる場合があります。</p></main><script>
const $=id=>document.getElementById(id);
const ROOT='https://keiba-track-data.sleeping4439.workers.dev';const API=ROOT+'/races';
const VERIFIED={'2026-10-12|東京|11':'pw01dde0105202604051120261012/FE','2026-10-10|京都|4':'pw01dde0108202604030420261010/49','2026-10-10|京都|1':'pw01dde0108202604030120261010/2A','2026-10-12|京都|4':'pw01dde0108202604050420261012/A9','2026-10-12|京都|6':'pw01dde0108202604050620261012/13','2026-10-12|京都|7':'pw01dde0108202604050720261012/C8','2026-10-10|東京|1':'pw01dde1005202604030120261010/2B','2026-10-10|東京|12':'pw01dde0105202604031220261010/53','2026-10-11|東京|12':'pw01dde0105202604041220261011/83','2026-10-12|京都|1':'pw01dde0108202604050120261012/8A','2026-10-12|京都|2':'pw01dde0108202604050220261012/3F','2026-10-12|京都|10':'pw01dde0108202604051020261012/27','2026-10-12|京都|12':'pw01dde0108202604051220261012/91','2026-10-12|東京|5':'pw01dde0105202604050520261012/80','2026-10-12|東京|12':'pw01dde0105202604051220261012/B3','2026-10-11|京都|1':'pw01dde0108202604040120261011/5A','2026-10-11|京都|2':'pw01dde0108202604040220261011/0F','2026-10-11|京都|3':'pw01dde0108202604040320261011/C4','2026-10-11|京都|5':'pw01dde0108202604040520261011/2E','2026-10-11|京都|6':'pw01dde0108202604040620261011/E3','2026-10-11|京都|7':'pw01dde0108202604040720261011/98','2026-10-11|京都|9':'pw01dde0108202604040920261011/02','2026-10-11|京都|12':'pw01dde0108202604041220261011/61','2026-10-10|京都|12':'pw01dde0108202604031220261010/31'};
let activeDate='',detailRequest=0;
function officialUrl(date,track,num){const code=VERIFIED[date+'|'+track+'|'+num];return code?'https://www.jra.go.jp/JRADB/accessD.html?CNAME='+encodeURIComponent(code):'';}
function makeHorseNameLink(name){const a=document.createElement('a');a.textContent=name;a.href='./yubaroku/?horseName='+encodeURIComponent(name);a.title='ゆ馬録で「'+name+'」を開く';a.style.cssText='font-weight:650;text-decoration:underline;text-decoration-color:#a2cdb4;text-underline-offset:3px';return a;}

const COMPARE_COLORS=['#d45b51','#287db7','#aa7b23','#7e56b4'];
const COMPARE_LABELS=['基礎スピード','最高速度','速度持続','運動持続','パワー'];
let compareNames=new Set();
function savedHorseProfiles(){try{const h=JSON.parse(localStorage.getItem('yubarokuHorsesV1')||'[]');return Array.isArray(h)?h:[]}catch{return []}}
function normalizeHorseName(s){return String(s||'').normalize('NFKC').trim()}
function findSavedProfile(name){return savedHorseProfiles().find(h=>normalizeHorseName(h.name)===normalizeHorseName(name)&&Array.isArray(h.values)&&h.values.length===5&&h.values.every(v=>Number.isInteger(v)&&v>=1&&v<=5))}
function chartPoint(level,index){const a=-Math.PI/2+index*2*Math.PI/5;return [210+Math.cos(a)*level*28,188+Math.sin(a)*level*28]}
function chartPolygon(values){return values.map((v,i)=>chartPoint(v,i).join(',')).join(' ')}
function makeSvg(tag,attrs={},textValue){const e=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,String(v));if(textValue!==undefined)e.textContent=textValue;return e}
function renderComparison(){
 const panel=$('comparePanel'),chart=$('compareChart'),status=$('compareStatus');
 panel.hidden=compareNames.size===0;if(panel.hidden)return;
 $('compareTitle').textContent='能力比較（'+compareNames.size+'/4頭）';
 chart.replaceChildren();const legend=document.createElement('div');legend.className='compare-legend';
 const selected=[...compareNames].map(name=>({name,profile:findSavedProfile(name)}));const found=selected.filter(x=>x.profile),missing=selected.filter(x=>!x.profile);
 for(const [i,item] of found.entries()){
  const row=document.createElement('div');row.className='compare-horse-row';row.style.setProperty('--horse-color',COMPARE_COLORS[i]);
  const tag=document.createElement('span');tag.className='compare-tag';tag.style.borderLeft='5px solid '+COMPARE_COLORS[i];tag.textContent=item.name;row.appendChild(tag);
  const traits=document.createElement('div');traits.className='compare-traits';
  const savedTraits=Array.isArray(item.profile.traits)?item.profile.traits.filter(t=>t&&typeof t.text==='string'&&t.text.trim()):[];
  if(savedTraits.length){for(const trait of savedTraits){const chip=document.createElement('span');chip.className='compare-trait'+(trait.negative?' negative':'');chip.textContent=trait.text;traits.appendChild(chip)}}
  else{const empty=document.createElement('span');empty.className='compare-traits-empty';empty.textContent='特性未登録';traits.appendChild(empty)}
  row.appendChild(traits);legend.appendChild(row);
 }
 chart.appendChild(legend);
 if(found.length){
  const svg=makeSvg('svg',{viewBox:'0 0 420 390',role:'img','aria-label':found.map(x=>x.name+'の能力レーダーチャート').join('、')});svg.classList.add('compare-svg');
  for(let n=1;n<=5;n++)svg.appendChild(makeSvg('polygon',{points:chartPolygon([n,n,n,n,n]),fill:'none',stroke:'#bdd1c5','stroke-width':n===5?1.5:1}));
  for(let i=0;i<5;i++){const p=chartPoint(5,i);svg.appendChild(makeSvg('line',{x1:210,y1:188,x2:p[0],y2:p[1],stroke:'#c4d6ca'}));const q=chartPoint(6.25,i);svg.appendChild(makeSvg('text',{x:q[0],y:q[1],fill:'#476452','font-size':12,'text-anchor':'middle','dominant-baseline':'middle'},COMPARE_LABELS[i]))}
  for(const [i,item] of found.entries()){const color=COMPARE_COLORS[i];svg.appendChild(makeSvg('polygon',{points:chartPolygon(item.profile.values),fill:color,'fill-opacity':0.13,stroke:color,'stroke-width':2.6,'stroke-linejoin':'round'}));for(let j=0;j<5;j++){const p=chartPoint(item.profile.values[j],j);svg.appendChild(makeSvg('circle',{cx:p[0],cy:p[1],r:3.2,fill:color}))}}
  chart.appendChild(svg);
 }
 status.replaceChildren();if(missing.length){const p=document.createElement('p');p.textContent='ゆ馬録に未登録、またはこの端末に未読込：'+missing.map(x=>x.name).join('、');status.appendChild(p);const a=document.createElement('a');a.href='./yubaroku/?horseName='+encodeURIComponent(missing[0].name);a.textContent='ゆ馬録で確認する ↗';status.appendChild(a)}
 if(!found.length){const p=document.createElement('p');p.textContent='比較するには、ゆ馬録に馬を登録し、必要に応じてクラウドから読み込んでください。';status.appendChild(p)}
}
function resetComparison(){compareNames.clear();$('comparePanel').hidden=true}
function makeCompareCheck(name){const input=document.createElement('input');input.type='checkbox';input.className='compare-check';input.setAttribute('aria-label',name+'を能力比較');input.checked=compareNames.has(name);input.addEventListener('change',()=>{if(input.checked){if(compareNames.size>=4){input.checked=false;alert('比較できるのは最大4頭です');return}compareNames.add(name)}else compareNames.delete(name);renderComparison()});return input}
$('clearCompare').addEventListener('click',()=>{resetComparison();document.querySelectorAll('.compare-check').forEach(x=>x.checked=false)});
window.addEventListener('storage',e=>{if(e.key==='yubarokuHorsesV1')renderComparison()});
async function loadEntries(sourceUrl){const id=++detailRequest;const target=$('entries');target.innerHTML='<div class="empty">出走馬を取得中…</div>';let parsed;try{parsed=new URL(sourceUrl);if(parsed.protocol!=='https:'||!['www.jra.go.jp','jra.jp'].includes(parsed.hostname)||parsed.pathname!=='/JRADB/accessD.html'||!parsed.searchParams.get('CNAME'))throw Error('JRA公式出馬表のURLを入力してください');let data=null,lastError='出走馬を取得できませんでした';for(let attempt=0;attempt<3;attempt++){if(id!==detailRequest)return;try{const response=await fetch(ROOT+'/entries?sourceUrl='+encodeURIComponent(parsed.href)+'&_='+Date.now()+'-'+attempt,{cache:'no-store'});data=await response.json();if(response.ok&&data.available&&Array.isArray(data.entries)&&data.entries.length)break;lastError=data.error||'出走馬を取得できませんでした';}catch(err){lastError=err.message||String(err)}if(attempt<2){target.innerHTML='<div class="empty">JRAから再取得しています…（'+(attempt+2)+'/3）</div>';await new Promise(resolve=>setTimeout(resolve,700*(attempt+1)));}}if(id!==detailRequest)return;if(!data?.available||!Array.isArray(data.entries)||!data.entries.length)throw Error(lastError);target.replaceChildren();for(const entry of data.entries){const row=document.createElement('div');row.className='entry-line';const n=document.createElement('span');n.className='entry-no';n.textContent=entry.number+'番';row.append(makeCompareCheck(entry.name),n,makeHorseNameLink(entry.name));target.appendChild(row)}$('entryHint').textContent='JRA公式出馬表から取得しました。';}catch(error){if(id!==detailRequest)return;target.replaceChildren();const e=document.createElement('div');e.className='empty';e.textContent=(error.message||'取得に失敗しました')+'。時間を置いて「出走馬を取得」を押すと再試行できます。';target.appendChild(e);}}
async function loadAutoEntries(date,track,number,manualFallback=''){
 const id=++detailRequest,target=$('entries');target.innerHTML='<div class="empty">JRA公式出馬表を照合・取得中…</div>';
 let error='出馬表を取得できませんでした';
 for(let attempt=0;attempt<2;attempt++){
  if(id!==detailRequest)return;
  try{
   const params=new URLSearchParams({date,track,number:String(number),_:String(Date.now())});
   const response=await fetch(ROOT+'/entries-by-race?'+params,{cache:'no-store'});
   const data=await response.json();
   if(id!==detailRequest)return;
   if(data.available&&Array.isArray(data.entries)&&data.entries.length&&data.date===date&&data.track===track&&data.number===number){
    target.replaceChildren();
    for(const entry of data.entries){const row=document.createElement('div');row.className='entry-line';const n=document.createElement('span');n.className='entry-no';n.textContent=entry.number+'番';row.append(makeCompareCheck(entry.name),n,makeHorseNameLink(entry.name));target.appendChild(row)}
    $('sourceInput').value=data.sourceUrl||'';$('entryHint').textContent='開催日・競馬場・レース番号をJRA公式出馬表と照合しました。';return;
   }
   error=data.error||'出走馬を取得できませんでした';
  }catch(e){error=e.message||String(e)}
 }
 if(id!==detailRequest)return;
 if(manualFallback){loadEntries(manualFallback);return;}
 target.innerHTML='<div class="empty">出馬表を自動特定できませんでした（'+error+'）。下の欄から公式URLを指定することもできます。</div>';
}
function raceTitleParts(raw){
 const name=normalizeRaceGrade(raw).replace(/(\d),(?=\d{3}\b)/g,'$1').replace(/\s+/g,' ').trim();
 const dist=name.match(/(?:^|\s)(\d{3,4})\s*（(?:芝|ダ|障)[^）]*）/);
 if(!dist)return {main:name,sub:''};
 const before=name.slice(0,dist.index).trim();
 const after=name.slice(dist.index).trim();
 const age=before.search(/(?:[234]歳(?:以上)?|障害[234]歳)/);
 if(age>0)return {main:before.slice(0,age).trim(),sub:(before.slice(age).trim()+' '+after).trim()};
 return {main:before||name,sub:after};
}
function raceHeading(number,name,withArrow=false){
 const parts=raceTitleParts(name);
 const wrap=document.createElement('span');wrap.className='race-heading';
 const num=document.createElement('span');num.className='race-heading-number';num.textContent=number+'R';
 const lines=document.createElement('span');lines.className='race-heading-lines';
 const primary=document.createElement('span');primary.className='race-heading-main';primary.textContent=parts.main;
 lines.appendChild(primary);
 if(parts.sub){const secondary=document.createElement('span');secondary.className='race-heading-sub';secondary.textContent=parts.sub;lines.appendChild(secondary)}
 wrap.append(num,lines);
 if(withArrow){const arrow=document.createElement('span');arrow.className='race-heading-arrow';arrow.textContent='›';wrap.appendChild(arrow)}
 return wrap;
}
let currentMemoKey='';
function memoStorageKey(date,track,number){return 'keiba-race-memo:v1:'+date+'|'+track+'|'+number}
$('raceMemo').addEventListener('input',()=>{if(!currentMemoKey)return;try{localStorage.setItem(currentMemoKey,$('raceMemo').value);$('memoStatus').textContent='この端末に保存済み';}catch(e){$('memoStatus').textContent='保存できませんでした';}});
function openRace(date,track,race){activeFavoriteRace={date,track,number:race.number,name:race.name};updateDetailFavorite();resetComparison();currentMemoKey=memoStorageKey(date,track,race.number);try{$('raceMemo').value=localStorage.getItem(currentMemoKey)||'';$('memoStatus').textContent='入力内容はこの端末に自動保存されます';}catch(e){$('raceMemo').value='';$('memoStatus').textContent='この端末では保存できません';}$('raceList').hidden=true;$('detail').hidden=false;$('raceTitle').replaceChildren();const trackName=document.createElement('span');trackName.className='race-detail-track';trackName.textContent=track;$('raceTitle').append(trackName,raceHeading(race.number,race.name));$('entries').replaceChildren();const source=officialUrl(date,track,race.number);$('sourceInput').value=source;$('entryHint').textContent=source?'確認済みのJRA公式出馬表を使用します。':'JRA公式サイトの該当レースの出馬表URLを貼り付けてください。';loadAutoEntries(date,track,race.number,source);}
$('loadEntries').addEventListener('click',()=>loadEntries($('sourceInput').value.trim()));
// Japan-local calendar dates, independent of the viewer's device timezone.
const fmt=d=>(d.getMonth()+1)+'/'+d.getDate()+'（'+'日月火水木金土'[d.getDay()]+'）';
const iso=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
const japanToday=()=>{const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const get=k=>Number(parts.find(p=>p.type===k).value);return new Date(get('year'),get('month')-1,get('day'),12)};
function saturdayOf(d){const x=new Date(d);x.setDate(x.getDate()+(x.getDay()===0?-1:(6-x.getDay()+7)%7));return x}
let weekOffset=0,selectedDates=[],request=0,activeTrack='東京';
const FAVORITE_KEY='keiba-race-favorites:2026-10-17-18';
const FAVORITE_DATES=new Set(['2026-10-17','2026-10-18']);
let activeFavoriteRace=null;
function favoriteId(r){return r.date+'|'+r.track+'|'+r.number}
function getFavorites(){try{const list=JSON.parse(localStorage.getItem(FAVORITE_KEY)||'[]');return Array.isArray(list)?list.filter(r=>r&&FAVORITE_DATES.has(r.date)&&ALL_FAVORITE_TRACKS.includes(r.track)&&Number.isInteger(r.number)&&r.number>=1&&r.number<=12&&typeof r.name==='string'):[]}catch{return []}}
const ALL_FAVORITE_TRACKS=['札幌','函館','福島','新潟','東京','中山','中京','京都','阪神','小倉'];
function hasFavorite(r){return getFavorites().some(x=>favoriteId(x)===favoriteId(r))}
function toggleFavorite(r){if(!FAVORITE_DATES.has(r.date))return;let list=getFavorites();const id=favoriteId(r);list=list.some(x=>favoriteId(x)===id)?list.filter(x=>favoriteId(x)!==id):[...list,r];try{localStorage.setItem(FAVORITE_KEY,JSON.stringify(list))}catch(e){alert('お気に入りを保存できませんでした');return}renderFavorites();updateDetailFavorite();if(typeof rerenderCurrentTrack==='function')rerenderCurrentTrack()}
let rerenderCurrentTrack=null;
function updateDetailFavorite(){const b=$('detailFavorite');if(!activeFavoriteRace||!FAVORITE_DATES.has(activeFavoriteRace.date)){b.hidden=true;return}b.hidden=false;b.textContent=hasFavorite(activeFavoriteRace)?'★ お気に入り解除':'☆ お気に入りに追加'}
$('detailFavorite').addEventListener('click',()=>{if(activeFavoriteRace)toggleFavorite(activeFavoriteRace)});
function renderFavorites(){const list=getFavorites();$('favoriteCount').textContent=list.length+'件';const box=$('favoriteList');box.replaceChildren();if(!list.length){const p=document.createElement('p');p.className='favorite-empty';p.textContent='レース一覧の☆を押すと、ここからすぐ開けます。';box.appendChild(p);return}list.sort((a,b)=>a.date.localeCompare(b.date)||a.track.localeCompare(b.track,'ja')||a.number-b.number);for(const r of list){const row=document.createElement('div');row.className='favorite-row';const open=document.createElement('button');open.className='favorite-open';open.type='button';open.textContent=r.date.slice(5).replace('-','/')+' '+r.track+' '+r.number+'R';const sub=document.createElement('small');sub.textContent=r.name;open.appendChild(sub);open.addEventListener('click',()=>{openRace(r.date,r.track,r);window.scrollTo({top:0,behavior:'smooth'})});const star=document.createElement('button');star.className='favorite-star';star.type='button';star.textContent='★';star.setAttribute('aria-label',r.track+r.number+'Rをお気に入りから解除');star.addEventListener('click',()=>toggleFavorite(r));row.append(open,star);box.appendChild(row)}}
renderFavorites();
const days=$('days');
let weekBuildId=0;
function appendDayButton(d){
 const b=document.createElement('button');b.dataset.date=iso(d);b.textContent=fmt(d);
 b.addEventListener('click',()=>showDay(d));days.appendChild(b);
}
async function buildWeek(preserveDate=''){
 const buildId=++weekBuildId;
 const saturday=saturdayOf(japanToday());saturday.setDate(saturday.getDate()+weekOffset*7);
 const sunday=new Date(saturday);sunday.setDate(sunday.getDate()+1);
 const monday=new Date(saturday);monday.setDate(monday.getDate()+2);
 // JRA occasionally races on a Monday (e.g. 2026-10-12).
 // Discover the third day from the actual JRA race-program API, not a fixed holiday calendar.
 const guaranteedMonday=iso(monday)==='2026-10-12';
 selectedDates=[saturday,sunday,...(guaranteedMonday?[monday]:[])];
 days.replaceChildren();
 for(const d of selectedDates)appendDayButton(d);
 $('weekLabel').textContent=fmt(saturday)+' 〜 '+fmt(selectedDates[selectedDates.length-1])+' 開催予定';
 const today=iso(japanToday());
 const target=selectedDates.find(d=>iso(d)===preserveDate)||selectedDates.find(d=>iso(d)===today)||selectedDates[0];
 showDay(target);
 $('currentWeek').disabled=weekOffset===0;
 if(guaranteedMonday)return;
 try{
  const response=await fetch(API+'?date='+iso(monday)+'&_='+Date.now(),{cache:'no-store'});
  if(!response.ok)throw Error('Monday schedule unavailable');
  const data=await response.json();
  if(buildId!==weekBuildId)return;
  if(Array.isArray(data.races)&&data.races.length>0){
   selectedDates.push(monday);appendDayButton(monday);
   $('weekLabel').textContent=fmt(saturday)+' 〜 '+fmt(monday)+' 開催予定';
   if(today===iso(monday)&&!preserveDate)showDay(monday);
  }
 }catch{/* Monday has no published racing, or the schedule is not yet available. */}
}
$('prevWeek').addEventListener('click',()=>{weekOffset--;buildWeek()});
$('nextWeek').addEventListener('click',()=>{weekOffset++;buildWeek()});
$('currentWeek').addEventListener('click',()=>{weekOffset=0;buildWeek()});
$('refreshRaces').addEventListener('click',()=>{const d=selectedDates.find(x=>iso(x)===activeDate)||selectedDates[0];showDay(d)});
// Verified JRA program backup for 2026-10-12; used only if the Worker schedule endpoint fails.
const VERIFIED_RACE_BACKUP={
 '2026-10-12':{
  '東京':[
   '2歳未勝利 1,400（ダ）','2歳未勝利 1,400（芝）','2歳未勝利 1,800（芝）','障害3歳以上未勝利 3,000（ダ）定量','2歳新馬 1,600（芝）（牝）','2歳新馬 1,300（ダ）','3歳以上1勝クラス 2,100（ダ）定量','3歳以上1勝クラス 1,600（芝）定量','プラタナス賞 2歳1勝クラス 1,600（ダ）','昇仙峡ステークス 3歳以上3勝クラス 2,400（芝）定量','オクトーバーステークス（L） 3歳以上オープン 2,000（芝）ハンデ','3歳以上1勝クラス 1,300（ダ）定量'
  ],
  '京都':[
   '2歳未勝利 1,400（ダ）（牝）','2歳未勝利 1,800（ダ）','2歳未勝利 1,400（芝）','2歳新馬 1,800（ダ）','2歳新馬 1,800（芝・外）','2歳新馬 1,200（芝）','3歳以上1勝クラス 1,900（ダ）定量','3歳以上1勝クラス 2,000（芝）（牝）定量','蹴上特別 3歳以上2勝クラス 1,800（ダ）定量','堀川特別 3歳以上2勝クラス 1,800（芝・外）定量','MBS賞スワンステークス（GⅡ） 3歳以上オープン 1,400（芝・外）別定','3歳以上1勝クラス 1,200（ダ）定量'
  ]
 }
};
function backupRaceData(date){
 const tracks=VERIFIED_RACE_BACKUP[date];if(!tracks)return null;
 return {date,available:true,sourceUrl:'https://jra.jp/keiba/calendar2026/2026/10/1012.html',backup:true,races:Object.entries(tracks).flatMap(([track,names])=>names.map((name,i)=>({track,number:i+1,name})))};
}
function cachedRaceData(date){try{const d=JSON.parse(localStorage.getItem('keibaRaceCache:'+date)||'null');return d&&Array.isArray(d.races)&&d.races.length?d:null}catch{return null}}
function rescueRaceData(date){return cachedRaceData(date)||backupRaceData(date)}
function normalizeRaceGrade(text){
 return String(text||'')
  .replace(/&(?:amp;)?#(?:x0*?85(?:45)?|0*?8545);?/gi,'Ⅱ')
  .replace(/&#(?:8545|x2161);?/gi,'Ⅱ')
  .replace(/&#(?:8544|x2160);?/gi,'Ⅰ')
  .replace(/&#(?:8546|x2162);?/gi,'Ⅲ')
  .replace(/(?:&amp;)?#(?:8544|8545|8546);?/gi,m=>({'8544':'Ⅰ','8545':'Ⅱ','8546':'Ⅲ'})[(m.match(/854[456]/)||[])[0]]||m)
  .replace(/G(?:&(?:amp;)?#|#)(?:x(?:2160|2161|2162)|(?:8544|8545|8546));?/gi,m=>{const v=m.match(/216[012]|854[456]/i)?.[0]?.toLowerCase();return ({'2160':'GⅠ','2161':'GⅡ','2162':'GⅢ','8544':'GⅠ','8545':'GⅡ','8546':'GⅢ'})[v]||m})
  .replace(/G[ⅠⅡⅢ]/g,m=>({'GⅠ':'G1','GⅡ':'G2','GⅢ':'G3'})[m])
  .replace(/G[ⅰⅱⅲ]/g,m=>({'Gⅰ':'G1','Gⅱ':'G2','Gⅲ':'G3'})[m]);
}
function showDay(d){
 rerenderCurrentTrack=null;
 activeDate=iso(d);const id=++request;
 days.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x.dataset.date===iso(d)));
 $('tracks').replaceChildren();$('races').innerHTML='<div class="empty">JRAのレース情報を取得中…</div>';
 fetch(API+'?date='+iso(d)+'&_='+Date.now(),{cache:'no-store'}).then(async r=>{
  const body=await r.text();let data;
  try{data=JSON.parse(body)}catch{throw Error('APIの応答がJSONではありません (HTTP '+r.status+')')}
  if(!r.ok)throw Error('HTTP '+r.status+' '+(data.error||''));return data;
 }).then(data=>{
  if(id!==request)return;
  const area=$('races');area.replaceChildren();
  if(!Array.isArray(data.races)||!data.races.length){const fallback=rescueRaceData(iso(d));if(fallback)data=fallback;}
  if(!Array.isArray(data.races)||!data.races.length){
   const err=document.createElement('div');err.className='empty';
   err.textContent='レース情報を取得できませんでした。API応答: '+JSON.stringify({available:data.available,error:data.error,notice:data.notice,sourceUrl:data.sourceUrl});
   area.appendChild(err);return;
  }
  if(!data.backup){try{localStorage.setItem('keibaRaceCache:'+iso(d),JSON.stringify(data))}catch{}}
  const available=[...new Set(data.races.map(x=>x.track).filter(Boolean))];
  if(!available.includes(activeTrack))activeTrack=available[0];
  const tabs=$('tracks');tabs.replaceChildren();
  function renderTrack(){
   tabs.querySelectorAll('button').forEach(b=>{const selected=b.dataset.track===activeTrack;b.classList.toggle('active',selected);b.setAttribute('aria-pressed',String(selected))});
   area.replaceChildren();
   rerenderCurrentTrack=renderTrack;
   const list=data.races.filter(x=>x.track===activeTrack).sort((a,b)=>b.number-a.number);
   for(const race of list){
    const row=document.createElement('div');row.className='row race-item';
    const title=document.createElement('button');
    title.appendChild(raceHeading(race.number,race.name,true));
    title.addEventListener('click',()=>openRace(iso(d),activeTrack,race));
    if(FAVORITE_DATES.has(iso(d))){const star=document.createElement('button');star.type='button';star.className='favorite-star';const favorite={date:iso(d),track:activeTrack,number:race.number,name:race.name};star.textContent=hasFavorite(favorite)?'★':'☆';star.setAttribute('aria-label',(hasFavorite(favorite)?'お気に入り解除: ':'お気に入り追加: ')+activeTrack+race.number+'R');star.addEventListener('click',()=>toggleFavorite(favorite));row.appendChild(star)}
    row.appendChild(title);area.appendChild(row);
   }
   if(!list.length){const p=document.createElement('p');p.className='empty';p.textContent='この競馬場のレース情報はありません。';area.appendChild(p)}
   if(data.sourceUrl){const a=document.createElement('a');a.href=data.sourceUrl;a.target='_blank';a.rel='noopener';a.textContent='JRA公式の競馬番組を確認 ↗';a.style.cssText='display:inline-block;margin-top:18px;font-size:13px';area.appendChild(a)}
  }
  for(const track of available){
   const b=document.createElement('button');b.type='button';b.dataset.track=track;b.textContent=track;
   b.addEventListener('click',()=>{activeTrack=track;renderTrack()});tabs.appendChild(b);
  }
  renderTrack();
 }).catch(err=>{if(id===request){$('tracks').replaceChildren();const area=$('races');area.replaceChildren();const box=document.createElement('div');box.className='empty';box.textContent='取得エラー: '+(err.message||String(err))+'。通信制限や一時的な接続障害の可能性があります。';area.appendChild(box)}})
}
buildWeek();
$('back').addEventListener('click',()=>{$('detail').hidden=true;$('raceList').hidden=false});
</script></body></html>
